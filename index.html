<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B6B80"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Stok Takip"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="icon-192.png">
<style>[hidden]{display:none!important}:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<script src="config.js"></script></head><body>
<title>Tesis Stok Takip</title>
<style>
/* Düzen: sabit alt sekme çubuğu, üstte sade uygulama çubuğu ve ürün sekmeleri, ince çizgili düz kartlar. Tek vurgu rengi (Okyanus, Lacivert ya da Zümrüt); hareket renkleri sabit kimliktir. Sayılar kolonlarda tabular, büyük rakamlarda orantılı. */
:root{
  --bg:#F1F4F6; --surface:#FFFFFF; --surface2:#F0F3F5; --fg:#0E1C24; --muted:#586A76; --line:#DCE3E8; --grid:#E8EDF0; --axis:#C5CFD6;
  --accent:#0B6B80; --accent-fg:#FFFFFF; --accent-soft:#E0F0F4;
  --c-alim:#1baf7a; --c-kul:#eb6834; --c-tr:#6250d6; --c-duz:#8A9BA5;
  --alim:#14724C; --alim-soft:#DDF1E8; --kul:#B04A12; --kul-soft:#FBE8D8; --tr:#5B4BC4; --tr-soft:#E9E6F8; --duz:#5E7078; --duz-soft:#E4EAEC;
  --danger:#C23B2D; --danger-soft:#FBE4E0;
  --f-body:-apple-system,BlinkMacSystemFont,system-ui,'SF Pro Text','Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A171C; --surface:#10232A; --surface2:#162E36; --fg:#E7F0F2; --muted:#8FA8B0; --line:#223D46; --grid:#1B343C; --axis:#2E4C57;
  --accent:#4DBAD0; --accent-fg:#062A31; --accent-soft:#12363F;
  --c-alim:#199e70; --c-kul:#d95926; --c-tr:#9085e9; --c-duz:#7C919A;
  --alim:#4CC38A; --alim-soft:#123A29; --kul:#F0A93B; --kul-soft:#402C0F; --tr:#A596F2; --tr-soft:#29244F; --duz:#9DB3BA; --duz-soft:#1F3236;
  --danger:#F08070; --danger-soft:#43211C; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0A171C; --surface:#10232A; --surface2:#162E36; --fg:#E7F0F2; --muted:#8FA8B0; --line:#223D46; --grid:#1B343C; --axis:#2E4C57;
  --accent:#4DBAD0; --accent-fg:#062A31; --accent-soft:#12363F;
  --c-alim:#199e70; --c-kul:#d95926; --c-tr:#9085e9; --c-duz:#7C919A;
  --alim:#4CC38A; --alim-soft:#123A29; --kul:#F0A93B; --kul-soft:#402C0F; --tr:#A596F2; --tr-soft:#29244F; --duz:#9DB3BA; --duz-soft:#1F3236;
  --danger:#F08070; --danger-soft:#43211C; color-scheme:dark;}

:root[data-accent="navy"]{--accent:#2C5AA8;--accent-fg:#FFFFFF;--accent-soft:#E0E8F6}
@media (prefers-color-scheme:dark){:root[data-accent="navy"]:not([data-theme="light"]){--accent:#86AEF2;--accent-fg:#0A1B36;--accent-soft:#17294A}}
:root[data-accent="navy"][data-theme="dark"]{--accent:#86AEF2;--accent-fg:#0A1B36;--accent-soft:#17294A}
:root[data-accent="emerald"]{--accent:#1B7A5A;--accent-fg:#FFFFFF;--accent-soft:#DAF0E6}
@media (prefers-color-scheme:dark){:root[data-accent="emerald"]:not([data-theme="light"]){--accent:#52D2A3;--accent-fg:#062A1E;--accent-soft:#12392C}}
:root[data-accent="emerald"][data-theme="dark"]{--accent:#52D2A3;--accent-fg:#062A1E;--accent-soft:#12392C}

*{box-sizing:border-box}
html.lock,html.lock body{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--fg);font:15.5px/1.5 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 130px;
  -webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer;-webkit-tap-highlight-color:transparent}
h1,h2,h3,p{margin:0}
.app{max-width:680px;margin:0 auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.view.in{animation:vin .28s ease-out both}
@keyframes vin{from{opacity:0;transform:translateY(6px)}}

/* uygulama çubuğu */
.appbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 12px}
.appbar-l{display:flex;align-items:center;gap:11px;min-width:0}
.mark{width:36px;height:36px;border-radius:9px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;flex:none}
.appbar-t{display:block;font-size:17px;font-weight:600;letter-spacing:-.01em;line-height:1.15}
.appbar small{display:block;font-size:12.5px;color:var(--muted);line-height:1.3}
.appbar-r{text-align:right;flex:none}
.appbar-r small:first-child{color:var(--fg);font-weight:500}

.mods{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:0 max(16px,env(safe-area-inset-left,0px))}
.ptabs{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none}
.ptabs::-webkit-scrollbar{display:none}
.pt{flex:none;background:none;border:0;border-bottom:2px solid transparent;padding:11px 0 10px;font-size:15px;font-weight:500;color:var(--muted);white-space:nowrap;margin-bottom:-1px}
.pt[aria-pressed="true"]{color:var(--fg);font-weight:600;border-bottom-color:var(--accent)}

.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:8px;font-weight:500;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg);font-weight:600}

.notes{display:flex;flex-direction:column;gap:8px;margin:14px 0 0}
.note{background:var(--accent-soft);border-radius:10px;padding:10px 13px;font-size:13.5px}
.note.bad{background:var(--danger-soft);color:var(--danger)}
.note.warn{background:var(--kul-soft);color:var(--kul)}
.link{background:none;border:0;padding:6px 0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}

.stack{display:flex;flex-direction:column;gap:12px;padding-top:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.card.flush{padding:4px 16px}
.h{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.hd .h{margin:0}
.hrow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.big{font:600 56px/1 var(--f-body);letter-spacing:-.025em;margin-top:8px}
.big .u{font:500 15px var(--f-body);color:var(--muted);margin-left:8px;letter-spacing:0}
.eq{font-size:13.5px;color:var(--muted);margin-top:4px}
.pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:6px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--alim-soft);color:var(--alim)}
.pill.warn{background:var(--kul-soft);color:var(--kul)}
.pill.bad{background:var(--danger-soft);color:var(--danger)}
.cover{margin-top:10px;font-size:13.5px;color:var(--muted)}
.note-s{font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.45}

/* ölçü hücreleri */
.kvs{display:grid;grid-template-columns:1fr 1fr;margin:14px -16px -16px;border-top:1px solid var(--line)}
.kvs.in{margin:0}
.kv{padding:12px 16px;border-bottom:1px solid var(--line);min-width:0}
.kv:nth-child(odd){border-right:1px solid var(--line)}
.kvs>.kv:nth-last-child(-n+2):nth-child(odd),.kvs>.kv:last-child{border-bottom:0}
.kvs>.kv:nth-last-child(2):nth-child(odd){border-bottom:0}
.kv small{display:block;font-size:12px;color:var(--muted);line-height:1.3}
.kv b{display:block;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em;margin-top:2px}
.kv b .u{font-size:12.5px;font-weight:500;color:var(--muted);margin-left:4px}
.kv>span{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
.up,.dn{white-space:nowrap}

/* konum çubukları */
.lrow+.lrow{margin-top:12px}
.lt{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:5px}
.lt b{font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.rk{display:flex;flex-direction:column;gap:11px}
.rk-r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:baseline;font-size:14px}
.rk-n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk-v{font-variant-numeric:tabular-nums;font-weight:600}
.rk-b{grid-column:1/-1;height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.rk-b i{display:block;height:100%;border-radius:3px;background:var(--c-kul)}

.list{display:flex;flex-direction:column}
.row{--t:var(--fg);--t-soft:var(--surface2);display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:10px 0;background:none;border:0;border-top:1px solid var(--line);text-align:left}
.row:active{background:var(--surface2)}
.list>.row:first-child,.dh+.row{border-top:0}
.badge{width:38px;height:38px;border-radius:9px;background:var(--t-soft);color:var(--t);display:grid;place-items:center;flex:none}
.rt{flex:1;min-width:0;display:flex;flex-direction:column}
.rt b{font-weight:600}
.rt small,.rq small{font-size:12.5px;color:var(--muted)}
.rt small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rq{display:flex;flex-direction:column;align-items:flex-end;flex:none}
.rq b{font-size:18px;font-weight:600;color:var(--t);font-variant-numeric:tabular-nums}
.dh{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:14px 0 6px}
.dh:first-child{padding-top:10px}
.t-alim{--t:var(--alim);--t-soft:var(--alim-soft)}
.t-kullanim{--t:var(--kul);--t-soft:var(--kul-soft)}
.t-transfer{--t:var(--tr);--t-soft:var(--tr-soft)}
.t-duzeltme,.t-gidis{--t:var(--duz);--t-soft:var(--duz-soft)}
.t-donus{--t:var(--alim);--t-soft:var(--alim-soft)}
.t-degisim{--t:var(--accent);--t-soft:var(--accent-soft)}
.st-kullanimda{--t:var(--accent);--t-soft:var(--accent-soft)}
.st-yedek{--t:var(--tr);--t-soft:var(--tr-soft)}
.st-dolu{--t:var(--alim);--t-soft:var(--alim-soft)}
.st-bos{--t:var(--kul);--t-soft:var(--kul-soft)}
.st-doluma{--t:var(--duz);--t-soft:var(--duz-soft)}
.spill{font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:6px;background:var(--t-soft);color:var(--t);white-space:nowrap}
.empty{padding:22px 8px;text-align:center;color:var(--muted);font-size:14px}
.empty.small{padding:28px 8px}
.more{margin:12px auto 0;display:block}

.sgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px}
.stile{--t:var(--fg);--t-soft:var(--surface2);grid-column:span 2;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px 8px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stile:nth-child(n+4){grid-column:span 3}
.stile[aria-pressed="true"]{background:var(--t-soft);border-color:var(--t)}
.sl{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sl::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--t);flex:none}
.stile b{font-size:30px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}

.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:15px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{background:var(--surface2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.dng{color:var(--danger);border-color:var(--danger)}
.btn.sm{min-height:38px;font-size:14px;padding:0 12px}

.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg-p{display:flex;background:var(--surface2);border-radius:10px;padding:3px;gap:3px;margin-bottom:12px}
.seg-p button{flex:1;border:0;background:none;border-radius:8px;min-height:36px;font-weight:600;font-size:14px;color:var(--muted)}
.seg-p button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 0 0 1px var(--line)}
.navp{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.navp b{font-size:16px;font-weight:600}
.iconbtn{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.iconbtn:disabled{opacity:.35}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile small{display:block;font-size:12px;color:var(--muted);letter-spacing:.02em}
.tile b{display:block;font-size:26px;font-weight:600;line-height:1.15;margin:3px 0 1px;letter-spacing:-.015em}
.tile span{font-size:12.5px;color:var(--muted)}
.filters{display:flex;flex-direction:column;gap:10px}
.filters select{width:100%}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.legend i.l{width:14px;height:3px;border-radius:2px;vertical-align:middle}
.bg-alim{background:var(--c-alim)}.bg-kullanim{background:var(--c-kul)}.bg-transfer{background:var(--c-tr)}.bg-duzeltme{background:var(--c-duz)}.bg-stok{background:var(--accent)}
.tablewrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
.tbl{border-collapse:collapse;width:100%;min-width:520px;font-size:13.5px}
.tbl th{font-size:11.5px;font-weight:600;color:var(--muted);text-align:right;padding:6px 8px;white-space:nowrap}
.tbl td{padding:9px 8px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);padding-left:0}
.tbl tr.tot td{font-weight:600}
.dim{color:var(--muted)}
.ledger{width:100%;border-collapse:collapse;font-size:14.5px;margin-top:14px}
.ledger td{padding:9px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.ledger td:first-child{width:22px;color:var(--muted);text-align:center}
.ledger td:last-child{text-align:right;font-weight:600}
.ledger tr.sum td{border-top:2px solid var(--fg);font-weight:600;padding-top:11px}
.ledger tr.sum td:first-child{color:var(--fg)}
.tv{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.tv summary{font-size:13px;color:var(--muted);cursor:pointer;padding:4px 0;list-style:none}
.tv summary::before{content:"▸ ";}
.tv[open] summary::before{content:"▾ ";}
.tv .tablewrap{max-height:260px;overflow:auto}

/* grafik */
.cv{position:relative;touch-action:pan-y;outline-offset:2px;user-select:none;-webkit-user-select:none}
.chart{display:block;width:100%;height:auto}
.gl{stroke:var(--grid);stroke-width:1}
.axl{stroke:var(--axis);stroke-width:1}
.ax{fill:var(--muted);font:10px var(--f-body)}
.vl{fill:var(--fg);font:600 11px var(--f-body)}
.ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.ar{fill:var(--accent);fill-opacity:.1}
.crit{stroke:var(--danger);stroke-width:1}
.dotm{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.tri{fill:var(--c-alim);stroke:var(--surface);stroke-width:2;paint-order:stroke}
.cx{stroke:var(--muted);stroke-width:1;pointer-events:none}
.cd{fill:var(--accent);stroke:var(--surface);stroke-width:2;pointer-events:none}
.hit{fill:transparent;cursor:crosshair}
.s-total{fill:var(--accent)}.s-up{fill:var(--c-alim)}.s-down{fill:var(--c-kul)}.s-tr{fill:var(--c-tr)}.s-adj{fill:var(--c-duz)}
.s-alim{fill:var(--c-alim)}.s-kullanim{fill:var(--c-kul)}.s-aralik{fill:var(--accent)}
.bg-g.on rect{opacity:.78}
.avgl{stroke:var(--muted);stroke-width:1}
.cv-tip{position:absolute;top:2px;pointer-events:none;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12.5px;box-shadow:0 8px 22px rgba(0,0,0,.16);min-width:132px;max-width:230px;z-index:3}
.cv-tip .tt{font-weight:600;margin-bottom:4px}
.cv-tip .tr{display:flex;align-items:center;justify-content:space-between;gap:12px;line-height:1.6}
.cv-tip .tr span{display:flex;align-items:center;gap:7px;color:var(--muted)}
.cv-tip .tr i{width:11px;height:3px;border-radius:2px;flex:none}
.cv-tip .tr b{font-variant-numeric:tabular-nums;font-weight:600}

/* sekme çubuğu */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);
  padding:0 max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px))}
.tabbar button{position:relative;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:500;color:var(--muted);padding:9px 0 8px;min-width:0}
.tabbar button[aria-current="page"]{color:var(--accent);font-weight:600}
.tabbar button[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:50%;width:30px;height:2px;margin-left:-15px;background:var(--accent)}
.fab{position:fixed;z-index:19;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(72px + env(safe-area-inset-bottom,0px));min-height:50px;padding:0 18px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-fg);font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:8px;box-shadow:0 6px 18px rgba(0,0,0,.28)}

.scrim{position:fixed;inset:0;background:rgba(4,16,20,.55);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:680px;z-index:41;max-height:92vh;max-height:92dvh;overflow-y:auto;background:var(--surface);border-radius:16px 16px 0 0;
  padding:8px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.sheet.in{animation:up .24s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 12px}
.sh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
.sh h2{font-size:19px;font-weight:600;letter-spacing:-.01em}
.x{width:40px;height:40px;border-radius:10px;border:0;background:var(--surface2);display:grid;place-items:center}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>label,.lbl{font-size:13px;font-weight:500;color:var(--muted)}
select,input[type="text"],input[type="date"],textarea{font:16px var(--f-body);color:var(--fg);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;min-height:48px;width:100%;text-align:left}
textarea{min-height:120px;resize:vertical}
input[type="checkbox"]{width:22px;height:22px;accent-color:var(--accent);flex:none;margin:0}
.tgrid{display:grid;gap:8px;margin-bottom:14px}
.tbtn{--t:var(--fg);--t-soft:var(--surface2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:58px;padding:6px 4px;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-size:13px;font-weight:500;min-width:0}
.tbtn[aria-pressed="true"]{border-color:var(--t);background:var(--t-soft);color:var(--t);font-weight:600}
.qty{display:flex;align-items:center;gap:8px}
.step{width:52px;height:52px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-size:24px;line-height:1;flex:none}
.qty input{font:600 28px var(--f-body);text-align:center;min-height:52px;flex:1;min-width:0}
.unit{font-size:14px;color:var(--muted);min-width:44px}
.hint{font-size:13px;color:var(--muted);min-height:18px;margin:-4px 0 12px}
.err{font-size:13.5px;color:var(--danger);min-height:0;margin:0 0 10px}
.err:empty{display:none}
.acts{display:flex;gap:10px;margin-top:8px}
.acts .btn{flex:1}
.crow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px 10px;padding:9px 0;border-top:1px solid var(--line)}
.crow label{display:flex;align-items:center;gap:10px;min-width:0;min-height:44px}
.cs{font-weight:600}
.kgf{display:flex;align-items:center;gap:6px}
.kgf input{width:104px;text-align:right;font-weight:600}
.chint{grid-column:1/-1;font-size:12.5px;color:var(--muted);margin-top:-4px}
.hrow2{display:grid;grid-template-columns:70px 1fr auto;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.hrow2 b{font-variant-numeric:tabular-nums;text-align:right}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;max-width:calc(100% - 32px);text-align:center}
.sec{margin-bottom:6px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper b{font-size:21px;font-weight:600;min-width:28px;text-align:center}
.logrow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.logrow small{color:var(--muted)}

/* panel */
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.ptile{position:relative;overflow:hidden;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;min-height:72px}
.ptile.main{grid-column:1/-1;min-height:84px;border-color:var(--accent)}
.ptile .fill{position:absolute;left:0;right:0;bottom:0;background:var(--accent);opacity:.14;border-top:2px solid var(--accent)}
.ptile small,.ptile b{position:relative}
.ptile small{display:block;font-size:12.5px;color:var(--muted);line-height:1.25;min-height:2.5em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ptile.main small{min-height:0}
.ptile b{font-size:28px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums}
.ptile.main b{font-size:34px}
.ptile.zero b{color:var(--muted);font-weight:500}
.pcols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pcols>*{min-width:0}
.pcard{padding:14px;text-align:center}
.pcard .h{text-align:left}
.ringwrap{position:relative;width:96px;height:96px;margin:10px auto 8px}
.ring{width:96px;height:96px}
.ring .r0{fill:none;stroke:var(--surface2);stroke-width:9}
.ring .rv{fill:none;stroke-width:9;stroke-linecap:round}
.ring .rv.ok{stroke:var(--accent)}.ring .rv.warn{stroke:var(--kul)}.ring .rv.bad{stroke:var(--danger)}
.rc{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.rc b{font-size:21px;font-weight:600;line-height:1}
.pcard .num{font-size:32px;font-weight:600;line-height:1;letter-spacing:-.02em}
.pcard .num span{font:500 13px var(--f-body);color:var(--muted);margin-left:5px;letter-spacing:0}
.pcard .eq{margin-top:6px}
.pcard .pill{margin-top:10px}

.swatches{display:flex;gap:10px;margin-top:6px}
.sw{flex:1;min-height:54px;border-radius:10px;border:2px solid var(--line);background:linear-gradient(135deg,var(--sa),var(--sb));color:#fff;font-weight:600;font-size:13px;display:flex;align-items:flex-end;padding:8px 10px;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.sw[aria-pressed="true"]{border-color:var(--fg)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.card.p0{padding:0}.p0>.hd{padding:14px 16px 8px;margin:0}.p0 .kvs.in{border-top:1px solid var(--line)}
.bg-g.on :is(rect,path){opacity:.78}.chart path.s-total,.chart path.s-alim,.chart path.s-kullanim,.chart path.s-aralik{}
.logrow b{font-weight:600}.logrow{align-items:flex-start;min-height:48px}.logrow>small{white-space:nowrap}
.up{color:var(--fg);font-weight:600}.dn{color:var(--fg);font-weight:600}

.card{box-shadow:0 1px 2px rgba(10,30,40,.05),0 6px 18px -10px rgba(10,30,40,.12)}
.ct{font-size:16px;font-weight:600;letter-spacing:-.01em;line-height:1.25}
.csub{font-size:13px;font-weight:400;color:var(--muted);margin-top:2px;line-height:1.4}
.chd{--t:var(--accent);--t-soft:var(--accent-soft);display:flex;align-items:flex-start;gap:11px;margin-bottom:12px}
.chd>div{flex:1;min-width:0}.chd>.btn,.chd>.link,.chd>span.muted{flex:none;align-self:center}
.card.flush>.chd{margin:14px 0 4px}.p0>.chd{padding:14px 16px 8px;margin:0}
.ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--t-soft);color:var(--t)}
.t-kritik{--t:var(--danger);--t-soft:var(--danger-soft)}
.kd{display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--t);margin-right:7px;vertical-align:1px}
.tile{position:relative;overflow:hidden;padding-left:17px}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--t)}
.tile .ico{position:absolute;right:10px;top:10px;width:28px;height:28px;border-radius:8px}
.tile b{font-size:30px}
.hero-st{border-left:4px solid var(--t)}
.meter{margin-top:16px}.mt-track{position:relative;height:10px;border-radius:5px;background:var(--surface2)}
.mt-fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--t)}
.mt-tick{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--fg);border-radius:1px}
.mt-l{position:relative;display:flex;font-size:12px;color:var(--muted);margin-top:7px;min-height:16px}
.zone{fill:var(--danger);fill-opacity:.07}
.pill{font-size:13px}
.hero-st .h{color:var(--t)}
.lastrec{font-size:26px;font-weight:600;letter-spacing:-.015em;margin-top:6px;line-height:1.15}
.feed{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.frow{display:flex;gap:2px;align-items:flex-start;font-size:13.5px;line-height:1.45;padding:3px 0}
.frow .kd{margin-top:6px;flex:none}.frow b{font-weight:600}

.bell{position:relative;display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--line);color:var(--fg);margin-right:10px;vertical-align:middle}
.bell .nb{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;font-style:normal;font-weight:700;line-height:18px;text-align:center}
.appbar-r{display:flex;align-items:center;gap:0}.appbar-r>div{text-align:right}
.nbadge{display:inline-block;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--danger);color:#fff;font-size:12px;font-weight:700;line-height:20px;text-align:center;vertical-align:middle;margin-left:6px}
.nrow{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.nrow>span{flex:1;min-width:0}.nrow b{display:block;font-weight:600;font-size:14.5px}.nrow small{display:block;color:var(--muted);font-size:13px;line-height:1.4;margin-top:2px}
.nrow .nd{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none;background:var(--warn,#C47F00)}.nrow.t-bad .nd{background:var(--danger)}
.nrow .btn.sm{flex:none}
.tundo{background:none;border:0;color:inherit;font:inherit;font-weight:700;text-decoration:underline;margin-left:14px;padding:6px 2px}
.qrow{padding:10px 0;border-top:1px solid var(--line)}
.qrow:first-of-type{border-top:0}
.qrow .qt{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.qrow .qt b{font-weight:600;font-size:15px}
.qrow .qt small{color:var(--muted);font-size:12.5px;text-align:right}
.qrow .qt small.ok{color:var(--alim);font-weight:600}
.qrow .chips{margin-top:8px}
.chip.q{border-color:var(--kul);color:var(--kul);background:var(--kul-soft);font-weight:600}
.chip.mini{padding:5px 11px;font-size:13px}
.fgrp{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ptabs{position:relative}
.fr{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 34px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 34px),transparent)}
.fl:not(.fr){-webkit-mask-image:linear-gradient(270deg,#000 calc(100% - 34px),transparent);mask-image:linear-gradient(270deg,#000 calc(100% - 34px),transparent)}
.fl.fr{-webkit-mask-image:linear-gradient(90deg,transparent,#000 34px,#000 calc(100% - 34px),transparent);mask-image:linear-gradient(90deg,transparent,#000 34px,#000 calc(100% - 34px),transparent)}
.dh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.dh span{font-size:12px;font-weight:500;letter-spacing:0;text-transform:none}
.srch{width:100%;margin:0 0 10px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);font:inherit;font-size:15px;-webkit-appearance:none;appearance:none}
.srch:focus{outline:2px solid var(--accent);outline-offset:1px}
.spr{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:6px}
.spr small{color:var(--muted);font-size:12px;white-space:nowrap}
.spk rect{fill:var(--kul)}.spk rect.z{opacity:.28}.spk rect.t{fill:var(--accent)}
.qlink{margin-left:2px}
/* ===== görsel katman v2 ===== */
:root{--p1:#0072B2;--p2:#00875F;--p3:#9C3D8A;--pg:#4F6272}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--p1:#0072B2;--p2:#00875F;--p3:#9C3D8A;--pg:#8FA3B1}}
:root[data-theme="dark"]{--p1:#0072B2;--p2:#00875F;--p3:#9C3D8A;--pg:#8FA3B1}
body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.h{letter-spacing:-.012em}
.pt{display:inline-flex;align-items:center;gap:7px;padding:9px 2px 8px;transition:color .2s ease,border-color .25s ease}
.pt .pdot{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:8px;background:color-mix(in srgb,var(--pc,var(--accent)) 16%,transparent);color:var(--pc,var(--accent));transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.pt[aria-pressed="true"]{border-bottom-color:var(--pc,var(--accent));color:var(--fg)}
.pt[aria-pressed="true"] .pdot{transform:scale(1.12)}
.ptile-ic{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:11px;flex:none;background:color-mix(in srgb,var(--pc,var(--accent)) 15%,transparent);color:var(--pc,var(--accent))}
.pcard{position:relative;overflow:hidden}
.pcard::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--pc,var(--accent))}
.pcard-hd{display:flex;align-items:center;gap:10px;margin:0 0 6px;text-align:left}
.hero-st{background:linear-gradient(150deg,color-mix(in srgb,var(--pc,var(--accent)) 10%,var(--surface)) 0%,var(--surface) 64%)}
.clipc{display:inline-flex;align-items:center;gap:3px;color:var(--accent);font-weight:600}
.tabbar{background:color-mix(in srgb,var(--surface) 86%,transparent);-webkit-backdrop-filter:saturate(1.8) blur(20px);backdrop-filter:saturate(1.8) blur(20px);border-top-color:transparent;box-shadow:0 -1px 0 var(--line)}
.tabbar button{transition:color .2s ease}
.tabbar button svg{transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.tabbar button[aria-current="page"] svg{transform:translateY(-2px) scale(1.08)}
.tabbar button:active svg{transform:scale(.86)}
.view.in{animation:vin .36s cubic-bezier(.2,.8,.2,1) both}
@keyframes vin{from{opacity:0;transform:translate3d(calc(var(--vdir,0) * 26px),8px,0)}}
.sheet.in{animation:sheetup .42s cubic-bezier(.2,.9,.25,1.06) both}
@keyframes sheetup{from{transform:translate3d(0,100%,0)}}
.scrim{animation:fadein .25s ease both}
@keyframes fadein{from{opacity:0}}
.row,.btn,.chip,.tbtn,.dthumb,.qebtn,.step{transition:transform .16s ease,background-color .2s ease,color .2s ease,border-color .2s ease,box-shadow .2s ease}
.row:active,.btn:active,.chip:active,.tbtn:active,.dthumb:active,.qebtn:active,.step:active{transform:scale(.97)}
.ring .rv{animation:ringin 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes ringin{from{stroke-dashoffset:213.6}}
.spk rect{animation:growbar .7s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:50% 100%}
@keyframes growbar{from{transform:scaleY(0)}}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:7px;flex:none}
.pill.bad::before{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3;transform:scale(.75)}}
.bell .nb,.nbadge{animation:pop .55s cubic-bezier(.3,1.5,.5,1) both}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.big,.pcard .num{animation:numin .5s ease both}
@keyframes numin{from{opacity:0;transform:translateY(4px)}}
.tundo{display:inline-flex;align-items:center;gap:5px}
@media (prefers-reduced-motion:reduce){.view.in,.sheet.in,.scrim,.ring .rv,.spk rect,.pill.bad::before,.bell .nb,.big,.pcard .num{animation:none!important}}
/* ===== görsel katman v3: sistem yazı tipi, renkli simge kutuları, sıvı göstergesi ===== */
.card{border-radius:16px}
.num,.rc b,.ptile b{font-variant-numeric:tabular-nums}
.ptile-ic,.pt .pdot{background:linear-gradient(160deg,var(--pc,var(--accent)),color-mix(in srgb,var(--pc,var(--accent)) 68%,#000));color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 3px 8px -4px color-mix(in srgb,var(--pc,var(--accent)) 70%,transparent)}
.ptile-ic{width:34px;height:34px;border-radius:10px}
.pt .pdot{width:24px;height:24px;border-radius:7px}
.lq{--lq:var(--accent)}.lq.warn{--lq:var(--kul)}.lq.bad{--lq:var(--danger)}
.lq .r0{fill:var(--surface2);stroke:none}
.lq .lqr{fill:none;stroke:var(--line);stroke-width:1.2}
.lq .lqw path{fill:var(--lq)}
.lq .lqw2 path{fill:var(--lq);opacity:.42}
.lqf{animation:lqrise 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes lqrise{from{transform:translateY(84px)}}
.lqw{animation:lqwv 6.5s linear infinite}
.lqw2{animation:lqwv 9s linear infinite reverse}
@keyframes lqwv{to{transform:translateX(-84px)}}
.rc b{display:inline-block;padding:3px 8px;border-radius:9px;background:color-mix(in srgb,var(--surface) 84%,transparent)}
@media (prefers-reduced-motion:reduce){.lqf,.lqw,.lqw2{animation:none!important}}
/* ===== görsel katman v4: tüm ekranlar, menüler, sheet'ler ===== */
:root{--sh1:rgba(10,30,40,.05);--sh2:rgba(10,30,40,.2);--hl:rgba(255,255,255,.8)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sh1:rgba(0,0,0,.3);--sh2:rgba(0,0,0,.55);--hl:rgba(255,255,255,.05)}}
:root[data-theme="dark"]{--sh1:rgba(0,0,0,.3);--sh2:rgba(0,0,0,.55);--hl:rgba(255,255,255,.05)}
body{background:radial-gradient(900px 440px at 50% -170px,color-mix(in srgb,var(--accent) 16%,transparent),transparent 72%),var(--bg)}
.appbar-t{font-size:19px;font-weight:700;letter-spacing:-.02em}
.mark{background:linear-gradient(160deg,var(--accent),color-mix(in srgb,var(--accent) 62%,#000));box-shadow:0 8px 16px -10px var(--accent),0 1px 0 rgba(255,255,255,.25) inset}
.card{border-radius:20px;box-shadow:0 1px 0 var(--hl) inset,0 1px 2px var(--sh1),0 16px 32px -22px var(--sh2)}
.h{letter-spacing:-.018em}
.ct{font-size:17px;font-weight:650;letter-spacing:-.015em}
.sechd{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.sechd .ico{width:32px;height:32px;border-radius:10px}
.ico,.badge,.tbtn svg,.sheet-hero .ico{background:linear-gradient(160deg,var(--t,var(--accent)),color-mix(in srgb,var(--t,var(--accent)) 62%,#000));color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.3) inset,0 5px 10px -6px color-mix(in srgb,var(--t,var(--accent)) 85%,transparent)}
.badge{width:40px;height:40px;border-radius:12px}
.tbtn svg{width:34px;height:34px;padding:8px;border-radius:12px;box-sizing:border-box}
.pill{border-radius:999px;padding:4px 11px}
.btn{min-height:50px;border-radius:14px;font-size:16px;font-weight:600}
.btn.pri{background:linear-gradient(170deg,color-mix(in srgb,var(--accent) 82%,#fff),var(--accent));border-color:transparent;box-shadow:0 12px 22px -14px var(--accent),0 1px 0 rgba(255,255,255,.25) inset}
.btn.dng{background:var(--danger-soft);border-color:transparent}
.btn.sm{min-height:38px;border-radius:12px}
.chip{border:0;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);padding:8px 15px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);box-shadow:none}
.seg-p{border-radius:14px;padding:4px;background:var(--surface2)}
.seg-p button{border-radius:11px;min-height:40px;transition:background-color .25s ease,box-shadow .25s ease,color .25s ease}
.seg-p button[aria-pressed="true"]{box-shadow:0 2px 8px -3px var(--sh2),0 0 0 1px var(--line)}
.tbtn{min-height:86px;border-radius:18px;border:1.5px solid var(--line);font-size:14px;font-weight:500}
.tbtn[aria-pressed="true"]{border-color:var(--t);background:color-mix(in srgb,var(--t) 10%,var(--surface));box-shadow:0 0 0 3px color-mix(in srgb,var(--t) 16%,transparent)}
select,input[type="text"],input[type="date"],textarea{border:0;border-radius:14px;background:var(--surface2);box-shadow:inset 0 0 0 1px var(--line);min-height:52px;padding:13px 14px}
select:focus,input:focus,textarea:focus{outline:none;box-shadow:inset 0 0 0 2px var(--accent),0 0 0 4px var(--accent-soft)}
.field>label{font-size:13px;font-weight:600;letter-spacing:.01em;color:var(--muted)}
.step{border-radius:14px;border:0;box-shadow:inset 0 0 0 1px var(--line)}
.hint:not(:empty){background:var(--surface2);border-radius:14px;padding:10px 12px;margin:2px 0 14px;color:var(--fg);font-size:13.5px;font-weight:500}
.sheet{border-radius:28px 28px 0 0;box-shadow:0 -12px 40px -14px var(--sh2)}
.sh h2{font-size:22px;font-weight:700;letter-spacing:-.022em}
.sheet-hero{display:flex;align-items:center;gap:12px;padding:12px;margin:0 0 14px;border-radius:18px;background:color-mix(in srgb,var(--t,var(--accent)) 9%,var(--surface2))}
.sheet-hero .ico{width:44px;height:44px;border-radius:14px}

function cloudCheck(){
  if(!CLOUD.db||CLOUD.busy)return;
  CLOUD.busy=true;
  getToken(false).then(function(){return readRemote()}).then(function(r){
    CLOUD.state='hazir';CLOUD.err=null;CLOUD.checked=true;
    var localAt=cloudAt(),dirty=isDirty(),hasReal=realList().length>0;
    if(!r){CLOUD.ok=true;CLOUD.busy=false;cloudSchedule(0);return}
    if(!isValid(r.d)){CLOUD.ok=true;CLOUD.busy=false;cloudSchedule(0);return}
    if(!hasReal&&stampOf(r.d)>0){CLOUD.busy=false;loadRemote(r.d,r.at,'Drive\'daki kayıtlarınız yüklendi');return}
    if(r.at>localAt){
      if(dirty&&hashOf(JSON.stringify(r.d))===hashOf(JSON.stringify(S))){CLOUD.ok=true;CLOUD.at=r.at;cloudSetAt(r.at);setHash(hashOf(JSON.stringify(S)))}
      else if(dirty){
        var mg=null;try{mg=mergeData(S,r.d,localAt)}catch(e){mg=null}
        if(mg&&isValid(mg)){snapshot('Drive ile birleştirmeden önce');S=mg;persist();CLOUD.ok=true;CLOUD.at=r.at;cloudSetAt(r.at);CLOUD.busy=false;if(!U.sheet)render();toast('Drive ile birleştirildi');cloudSchedule(0);return}
        CLOUD.conflict=true;CLOUD.pending={d:r.d,at:r.at}
      }
      else{CLOUD.busy=false;loadRemote(r.d,r.at,'Drive\'daki daha yeni kayıtlar yüklendi');return}
    }else{
      CLOUD.ok=true;CLOUD.at=r.at;
      if(dirty){CLOUD.busy=false;cloudSchedule(0);return}
    }
  }).catch(function(e){failState(e)}).then(function(){CLOUD.busy=false;if(!U.sheet)render();else updateChip()});
}
function cloudSchedule(ms){
  if(!CLOUD.db||CLOUD.conflict||!mirrorOn)return;

function cloudPush(){

  if(CLOUD.busy){CLOUD.again=true;return}

  var j=JSON.stringify(S),h=hashOf(j);

  var at=Date.now();

  .then(function(){return dailyCopy()})

function cloudConnect(){

/* kayıt, tutanak ilk oluşturulduğundaki bilgilerle (snapshot) saklanır */
function tutSnapOf(rec,kind){
  if(rec.tut&&rec.tut.snap)return rec.tut.snap;
  var sn;
  if(kind==='ship')sn=tutShipSnap(rec);
  else{
    var p=P(rec.productId),set=tutSetOf(rec.productId),kt=rec.kantar||null;
    sn={prod:rec.productId,kind:'teslim',set:set,date:rec.date,evrak:rec.evrak||rec.date,unit:p?p.unit:'',qty:rec.qty,kg:kt?kt.kg:kgOf(p,rec.qty),kd:kt?kt.date:rec.date};
  }
  if(kind!=='ship')Object.assign(sn,{brut:rec.kantar&&rec.kantar.brut!=null?rec.kantar.brut:null,amb:rec.kantar&&rec.kantar.amb!=null?rec.kantar.amb:null});
  rec.tut=rec.tut||{};if(!rec.tut.docs)rec.tut.docs=[];rec.tut.snap=sn;persist();
  return sn;
}
/* gaz sevkiyatı tutanak verisi: tüp seri no ve tartılan kilo (boş kiloysa boş bırakılır) */
function tutShipSnap(rec){
  return {prod:'gaz',kind:rec.dir,set:tutSetOf('gaz'),date:rec.date,evrak:rec.evrak||rec.date,n:rec.items.length,tubes:rec.items.map(function(it){var c=S.cyl.find(function(x){return x.id===it.cid});return {serial:c?c.serial:'?',kg:(it.kg==null||isNaN(it.kg))?null:it.kg}})};
}

/* ---- Yazdırma ----
   iOS ana ekran uygulamasında window.print çalışmaz. iOS'ta tutanak PDF olarak hazırlanır ve
   paylaşım sayfası açılır; oradan "Yazdır" seçilir. Diğer tarayıcılarda tarayıcının yazdırma penceresi açılır. */
var TP={W:1240,H:1754,M:150};
function tpClear(x){x.fillStyle='#fff';x.fillRect(0,0,TP.W,TP.H);x.fillStyle='#000';x.strokeStyle='#000';x.lineWidth=2;x.textBaseline='top'}
function tpGo(){var c=document.createElement('canvas');c.width=TP.W;c.height=TP.H;var x=c.getContext('2d');tpClear(x);return {c:c,x:x,y:TP.M,pages:[]}}
function tpBreak(g,h){if(g.y+h>TP.H-TP.M){g.pages.push(g.c.toDataURL('image/jpeg',0.92));tpClear(g.x);g.y=TP.M}}
function tpWrap(x,text,font,maxW){x.font=font;var words=String(text).replace(/\s+/g,' ').trim().split(' '),out=[],cur='';
  words.forEach(function(w){var t=cur?cur+' '+w:w;if(cur&&x.measureText(t).width>maxW){out.push(cur);cur=w}else cur=t});
  out.push(cur);return out}
function tpPara(g,text,o){
  var font=(o.bold?'bold ':'')+o.size+'px Arial, Helvetica, sans-serif',lh=Math.round(o.size*1.5),ind=o.indent||0;
  var lines=tpWrap(g.x,text,font,TP.W-2*TP.M-ind);g.x.font=font;
  lines.forEach(function(ln,i){tpBreak(g,lh);var w=g.x.measureText(ln).width,xx=TP.M+(i===0?ind:0);
    if(o.align==='center')xx=(TP.W-w)/2;else if(o.align==='right')xx=TP.W-TP.M-w;
    g.x.fillText(ln,xx,g.y);g.y+=lh});
  g.y+=(o.after||0)}
function tpTable(g,t){
  var rows=Array.prototype.map.call(t.rows,function(r){return Array.prototype.map.call(r.cells,function(c){return {text:c.textContent.replace(/\s+/g,' ').trim(),bold:c.tagName==='TH'||!!c.querySelector('b'),span:c.colSpan||1}})});
  var cols=Math.max.apply(null,rows.map(function(r){return r.reduce(function(a,c){return a+c.span},0)})),cw=(TP.W-2*TP.M)/cols,size=24,h=size+22;
  rows.forEach(function(r){tpBreak(g,h);var col=0;
    r.forEach(function(c){var w=cw*c.span,x0=TP.M+col*cw;g.x.strokeRect(x0,g.y,w,h);
      g.x.font=(c.bold?'bold ':'')+size+'px Arial, Helvetica, sans-serif';var tw=g.x.measureText(c.text).width;
      g.x.fillText(c.text,x0+(w-tw)/2,g.y+11);col+=c.span});
    g.y+=h});
  g.y+=24}
function tpSig(g,t){
  var cw=(TP.W-2*TP.M)/2;
  Array.prototype.forEach.call(t.rows,function(r){
    var cells=Array.prototype.slice.call(r.cells),items=cells.map(function(c){return Array.prototype.slice.call(c.querySelectorAll('b,div.fl'))});
    var n=Math.max.apply(null,items.map(function(a){return a.length})),rowH=n*48+30;
    tpBreak(g,rowH);
    items.forEach(function(list,ci){var x0=TP.M+ci*cw,y=g.y;
      list.forEach(function(el){
        if(el.tagName==='B'){g.x.font='bold 26px Arial, Helvetica, sans-serif';g.x.fillText(el.textContent.trim(),x0,y)}
        else{var label=el.textContent.replace(/\s+/g,' ').trim();g.x.font='24px Arial, Helvetica, sans-serif';g.x.fillText(label,x0,y);
          var lw=g.x.measureText(label).width;g.x.fillRect(x0+lw+10,y+30,cw*0.55-lw-10,2)}
        y+=48})});
    g.y+=rowH});
  g.y+=30}
function tpRender(html){
  var root=new DOMParser().parseFromString(html,'text/html').querySelector('.page'),g=tpGo();
  if(!root)return g;
  Array.prototype.forEach.call(root.children,function(el){
    var tag=el.tagName,cls=el.className||'';
    if(tag==='H1')tpPara(g,el.textContent,{size:38,bold:true,align:'center',after:50});
    else if(cls==='evrak')tpPara(g,el.textContent,{size:24,align:'right',after:24});
    else if(tag==='P')tpPara(g,el.textContent,{size:26,indent:74,after:26});
    else if(tag==='TABLE'&&cls==='tub')tpTable(g,el);
    else if(tag==='TABLE'&&cls==='sig')tpSig(g,el);
    else if(cls==='ek'){Array.prototype.forEach.call(el.children,function(p){tpPara(g,p.textContent,{size:24,after:6})});g.y+=20}
  });
  g.pages.push(g.c.toDataURL('image/jpeg',0.92));
  return g}
function tpPdf(pages){
  var enc=new TextEncoder(),parts=[],off=0,xref=[],n=pages.length,size=3+3*n;
  function add(s){var b=typeof s==='string'?enc.encode(s):s;parts.push(b);off+=b.length}
  function obj(num,body){xref[num]=off;add(num+' 0 obj\n');add(body);add('\nendobj\n')}
  add('%PDF-1.4\n');
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  var kids=[];for(var i=0;i<n;i++)kids.push((3+3*i)+' 0 R');
  obj(2,'<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+n+' >>');
  for(var k=0;k<n;k++){
    var pg=3+3*k,ct=4+3*k,im=5+3*k,cs='q 595.28 0 0 841.89 0 0 cm /Im'+k+' Do Q';
    obj(pg,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im'+k+' '+im+' 0 R >> >> /Contents '+ct+' 0 R >>');
    obj(ct,'<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream');
    var bin=atob(pages[k].split(',')[1]),bytes=new Uint8Array(bin.length);for(var q=0;q<bin.length;q++)bytes[q]=bin.charCodeAt(q);
    xref[im]=off;add(im+' 0 obj\n<< /Type /XObject /Subtype /Image /Width '+TP.W+' /Height '+TP.H+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+bytes.length+' >>\nstream\n');
    add(bytes);add('\nendstream\nendobj\n')}
  var xo=off,x='xref\n0 '+size+'\n0000000000 65535 f \n';
  for(var j=1;j<size;j++)x+=('0000000000'+xref[j]).slice(-10)+' 00000 n \n';
  add(x);add('trailer\n<< /Size '+size+' /Root 1 0 R >>\nstartxref\n'+xo+'\n%%EOF\n');
  var out=new Uint8Array(off),p=0;parts.forEach(function(b){out.set(b,p);p+=b.length});
  return new Blob([out],{type:'application/pdf'})}
function tutPdfBlob(s){return tpPdf(tpRender(s.html).pages)}
function tutFileName(s){return String(s.title||'Tutanak').replace(/[\/\\:*?"<>|]+/g,'-').trim()+'.pdf'}
function tutPrint(){
  var s=U.sheet;if(!s||s.kind!=='tutview')return;
  var ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  if(!ios){
    tutCss();
    var pg=new DOMParser().parseFromString(s.html,'text/html').querySelector('.page');
    if(!pg){toast('Tutanak hazırlanamadı');return}
    var host=document.getElementById('tutprint');
    if(!host){host=document.createElement('div');host.id='tutprint';host.className='tutdoc';document.body.appendChild(host)}
    host.innerHTML=pg.outerHTML;
    try{window.print()}catch(e){toast('Yazdırma açılamadı.')}
    return}
  /* iOS: PDF hazırlanır, paylaşım sayfası açılır (kullanıcı dokunuşu içinde, hemen) */
  var f;
  try{f=new File([tutPdfBlob(s)],tutFileName(s),{type:'application/pdf'})}catch(e){toast('PDF hazırlanamadı');return}
  if(navigator.canShare&&navigator.canShare({files:[f]})){
    navigator.share({files:[f],title:f.name}).catch(function(e){if(!e||e.name!=='AbortError')toast('Paylaşım açılamadı. Uygulamayı Safari\'de açıp tekrar deneyin.')});
    return}
  var w=window.open(URL.createObjectURL(f),'_blank');
  if(!w)toast('PDF açılamadı. Uygulamayı Safari\'de açıp tekrar deneyin.')}

/* belge adı: "Ürün gün.ay.yıl Tür.uzantı" (ör. "Alüminyum Sülfat 24.11.2026 İrsaliye.jpg") */
function tutProdName(rec,kind){if(kind==='ship')return 'Gaz Klor';var sn=rec.tut&&rec.tut.snap,st=(sn&&sn.set&&sn.set.urun)?sn.set:tutSetOf(rec.productId);return st.urun||((P(rec.productId)||{}).name)||'Ürün'}
function tutNameFor(rec,kind,role,ext){
  var base=tutProdName(rec,kind)+' '+dtr(rec.date)+' '+(TUT_ROLE_NAME[role]||'Tutanak'),used={};
  S.ships.concat(S.moves,S.shipDrafts||[],[rec]).forEach(function(r){((r.tut&&r.tut.docs)||[]).forEach(function(d){used[String(d.name).replace(/\.[^.]+$/,'')]=1})});
  var stem=base,n=2;while(used[stem]){stem=base+' ('+n+')';n++}
  return stem+'.'+ext;
}
/* arşiv yolu: ürün > "ihale no · firma kısa adı". İhale ya da firma değişince yeni klasör oluşur. */
function tutArchiveOf(rec,kind){
  var sn=rec.tut&&rec.tut.snap,st=(sn&&sn.set)?sn.set:tutSetOf(kind==='ship'?'gaz':rec.productId);
  var clean=function(x){return String(x||'').replace(/[\/\\']/g,'-').trim()};
  return [clean(tutProdName(rec,kind)),clean((st.ihale||'İhale no yok')+' · '+(st.kisa||st.firma||'Firma yok'))];
}
function tutStore(rec,kind,blob,ext,mime,thumb,role){

  return dbPut(id,{b:blob,t:thumb||null}).then(function(){
    rec.tut=rec.tut||{};if(!rec.tut.docs)rec.tut.docs=[];
    rec.tut.docs.push({id:id,mime:mime,name:tutNameFor(rec,kind,role,ext),size:blob.size,t:Date.now(),drive:null,role:role,arsiv:tutArchiveOf(rec,kind)});
  });
}
function tutPick(files){
  var s=U.sheet;if(!s)return;var isShip=s.kind==='ship'||s.kind==='gidis'||s.kind==='donus';if(!isShip&&s.kind!=='minfo'&&s.kind!=='move')return;
  var kind=isShip?'ship':'move',rec=tutRecOf(kind,s.id||(s.f&&s.f.id));if(!rec)return;
  var role=tutCurRole(kind);
  var chain=Promise.resolve(),bad=0;
  files.forEach(function(f){chain=chain.then(function(){
    var isPdf=/pdf$/i.test(f.type||'')||/\.pdf$/i.test(f.name||'');
    if(isPdf)return tutStore(rec,kind,f,'pdf','application/pdf',null,role);
    return packImage(f).then(function(r){return tutStore(rec,kind,r.full,'jpg','image/jpeg',r.thumb,role)});
  }).catch(function(){bad++})});
  chain.then(function(){
    persist();if(typeof docsSync==='function')setTimeout(docsSync,300);
    if(U.sheet===s)renderSheet();
    toast(bad?bad+' dosya eklenemedi':(TUT_ROLE_NAME[role]||'Belge')+' kaydedildi');
  });
}

/* Drive: Tutanaklar klasörü ve dosya yüklemesi */
/* Tutanaklar > ürün > "ihale · firma" klasör yolu; eksik klasörler otomatik açılır */
function tutDir(path){
  return ensureDirs().then(function(){
    /* önbellekteki klasör hâlâ geçerli mi: çöpe atılmamış, silinmemiş ve doğru üst klasörde olmalı */
    var keep=function(key,parent){var c=CLOUD.dirs[key];if(!c)return Promise.resolve(null);
      return dfetch('https://www.googleapis.com/drive/v3/files/'+c+'?fields=id,trashed,parents').then(function(r){return r.json()}).then(function(j){
        var okP=!parent||(j.parents||[]).indexOf(parent)>=0;return (j&&j.id&&!j.trashed&&okP)?c:null;
      }).catch(function(){return null})};
    var base=keep('tut',CLOUD.dirs.root).then(function(id){if(id)return id;return findOrMakeFolder('Tutanaklar',CLOUD.dirs.root).then(function(nid){CLOUD.dirs.tut=nid;return nid})});
    return base.then(function(root){
      var cur=Promise.resolve(root),acc='';
      (path||[]).filter(Boolean).forEach(function(name){
        acc+='/'+name;var key='tutp:'+acc;
        cur=cur.then(function(parent){
          return keep(key,parent).then(function(id){
            if(id)return id;
            return findOrMakeFolder(name,parent).then(function(nid){CLOUD.dirs[key]=nid;return nid});
          });
        });
      });
      return cur;
    });
  });
}
function tutUpload(d){
  return dbGet(d.id).then(function(rec){
    if(!rec||!rec.b)throw {code:'noblob',skip:true};
    return tutDir(d.arsiv||(d.prod?[d.prod]:null)).then(function(dir){
      var bd='b'+Date.now()+Math.random().toString(36).slice(2),meta=JSON.stringify({name:d.name,parents:[dir],mimeType:d.mime});
      var body=new Blob(['--'+bd+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+meta+'\r\n--'+bd+'\r\nContent-Type: '+d.mime+'\r\n\r\n',rec.b,'\r\n--'+bd+'--']);
      return dfetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+bd},body:body}).then(function(r){return r.json()});
    });
  });
}

/* ---------- hesaplar ---------- */
var P=function(id){return S.products.find(function(p){return p.id===id})};
var lname=function(id){var l=S.locations.find(function(x){return x.id===id});return l?l.name:'?'};
function curP(){if(!P(U.mod))U.mod=S.products[0].id;return P(U.mod)}
function movesOf(pid){return S.moves.filter(function(m){return m.productId===pid})}
function balances(pid,upTo,exId){
  var b={};S.locations.forEach(function(l){b[l.id]=0});
  movesOf(pid).forEach(function(m){
    if(m.id===exId)return;if(upTo&&m.date>upTo)return;if(m.draft)return;
    if(m.from)b[m.from]=(b[m.from]||0)-m.qty;if(m.to)b[m.to]=(b[m.to]||0)+m.qty;
  });
  return b;
}
function validate(moves){
  var b={};
  var sorted=sortMoves(moves);
  for(var i=0;i<sorted.length;i++){
    var m=sorted[i],k=m.productId;b[k]=b[k]||{};if(m.draft)continue;
    if(m.from){b[k][m.from]=(b[k][m.from]||0)-m.qty;if(b[k][m.from]<-1e-9)return {move:m,loc:m.from,bal:b[k][m.from]}}
    if(m.to)b[k][m.to]=(b[k][m.to]||0)+m.qty;
  }
  return null;
}
function stockErr(v){
  var p=P(v.move.productId);
  return 'Stok yetmiyor: '+(p.multi?lname(v.loc)+' konumunda ':'')+dshort(v.move.date)+' tarihli işlemden sonra bakiye '+fmt(v.bal)+' '+p.unit+' olur.';
}
function netMap(){
  var m={},last={};
  sortShips().forEach(function(s){s.items.forEach(function(it){
    if(s.dir==='gidis')last[it.cid]=it.kg;
    else if(last[it.cid]!=null){m[s.id+':'+it.cid]=it.kg-last[it.cid];delete last[it.cid]}
  })});
  return m;
}
function prevOutKg(cid,date,exId){
  var last={};
  sortShips().forEach(function(s){
    if(s.id===exId||s.date>date)return;
    s.items.forEach(function(it){if(it.cid===cid){if(s.dir==='gidis')last[cid]=it.kg;else delete last[cid]}});
  });
  return last[cid];
}
function cylHist(cid){
  var out=[];sortShips().forEach(function(s){s.items.forEach(function(it){if(it.cid===cid)out.push({s:s,it:it})})});return out;
}
function lastInfo(cid,nets){
  var h=cylHist(cid);if(!h.length)return 'Henüz sevkiyat kaydı yok';
  var l=h[h.length-1];
  if(l.s.dir==='gidis')return 'Doluma gitti '+dshort(l.s.date)+' · '+fmtKg(l.it.kg)+' kg';
  var net=nets[l.s.id+':'+l.it.cid];
  return 'Dolumdan geldi '+dshort(l.s.date)+' · '+fmtKg(l.it.kg)+' kg'+(net!=null?' (+'+fmtKg(net)+' kg klor)':'');
}

function niceTop(mx){
  if(mx<=10)return Math.max(2,Math.ceil(mx/2)*2);
  var e=Math.pow(10,Math.floor(Math.log10(mx))),f=mx/e,c=[1.2,2,3,4,5,6,8,10];
  for(var i=0;i<c.length;i++){if(c[i]>=f)return c[i]*e}
  return 10*e;
}

function dailySeries(pid,loc,from,to){
  var t=todayISO();if(to>t)to=t;if(from>to)return [];
  var B0=balances(pid,iso(addDays(parse(from),-1))),bal=loc==='all'?sum(B0):(B0[loc]||0),by={};
  movesOf(pid).forEach(function(m){if(m.date>=from&&m.date<=to)(by[m.date]=by[m.date]||[]).push(m)});
  var out=[],d=parse(from),e=parse(to);
  for(;d<=e;d=addDays(d,1)){
    var k=iso(d),r={d:k,alim:0,kul:0,adj:0,trIn:0,trOut:0,n:0};
    (by[k]||[]).forEach(function(m){
      var inS=loc==='all'?!!m.to:m.to===loc,outS=loc==='all'?!!m.from:m.from===loc;
      if(m.type==='alim'){if(inS)r.alim+=m.qty}
      else if(m.type==='kullanim'){if(outS)r.kul+=m.qty}
      else if(m.type==='transfer'){if(loc!=='all'){if(inS)r.trIn+=m.qty;if(outS)r.trOut+=m.qty}}
      else{if(inS)r.adj+=m.qty;if(outS)r.adj-=m.qty}
      r.n++;
    });
    bal+=r.alim-r.kul+r.adj+r.trIn-r.trOut;r.bal=bal;out.push(r);
  }
  return out;
}
function agg(pid,range,loc){
  var t=todayISO(),end=range.e>t?t:range.e,B0=balances(pid,iso(addDays(parse(range.s),-1)));
  var r={open:loc==='all'?sum(B0):(B0[loc]||0),alim:0,kul:0,trIn:0,trOut:0,up:0,dn:0,nAlim:0,nKul:0,nTr:0,nAdj:0};
  movesOf(pid).forEach(function(m){
    if(m.date<range.s||m.date>range.e)return;
    var inS=loc==='all'?!!m.to:m.to===loc,outS=loc==='all'?!!m.from:m.from===loc;
    if(m.type==='alim'){if(inS){r.alim+=m.qty;r.nAlim++}}
    else if(m.type==='kullanim'){if(outS){r.kul+=m.qty;r.nKul++}}
    else if(m.type==='transfer'){if(loc!=='all'&&(inS||outS)){r.nTr++;if(inS)r.trIn+=m.qty;if(outS)r.trOut+=m.qty}}
    else{r.nAdj++;if(inS)r.up+=m.qty;if(outS)r.dn+=m.qty}
  });
  r.end=r.open+r.alim+r.trIn+r.up-r.kul-r.trOut-r.dn;
  r.days=Math.max(0,daysBetween(range.s,end)+1);
  return r;
}

    xLbls(ser,X,H)+'<line class="cx" y1="'+Tp+'" y2="'+(Tp+ih)+'" style="display:none"/><circle class="cd" r="4.5" style="display:none"/></svg>';

function logSorted(){S.gazLog.forEach(function(e){if(!e.id)e.id='g'+uid()});return S.gazLog.slice().sort(function(a,b){return a.from<b.from?-1:a.from>b.from?1:0})}
function logStats(){
  var L=logSorted(),gaps=[],i;
  for(i=1;i<L.length;i++)gaps.push({days:daysBetween(L[i-1].from,L[i].from),d:L[i].from,prev:L[i-1].from});
  var avg=gaps.length?Math.round(gaps.reduce(function(s,g){return s+g.days},0)/gaps.length):null;
  return {L:L,gaps:gaps,avg:avg,last:L.length?L[L.length-1]:null};
}
function logRange(e){return dshort(e.from)+(e.to?' – '+dshort(e.to):'')}
function logKv(st){
  var t=todayISO(),next=st.last&&st.avg!=null?iso(addDays(parse(st.last.from),st.avg)):null;
  return '<div class="kvs in">'+
    kv('Son değişim',st.last?esc(dshort(st.last.from)):'–',st.last?daysBetween(st.last.from,t)+' gün önce':'Kayıt yok')+
    kv('Ortalama aralık',st.avg!=null?st.avg+'<span class="u">gün</span>':'–',st.avg!=null?st.gaps.length+' aralık üzerinden':'En az iki kayıt gerekir')+
    kv('Tahmini sonraki',next?esc(dshort(next)):'–',next?(next<t?(daysBetween(next,t)+' gün geçti'):(daysBetween(t,next)+' gün sonra')):'')+
    kv('Kayıt sayısı',String(st.L.length),'tüp değişimi')+'</div>';
}

function nrm(x){return String(x==null?'':x).toLocaleLowerCase('tr').replace(/ç/g,'c').replace(/ğ/g,'g').replace(/ı/g,'i').replace(/ö/g,'o').replace(/ş/g,'s').replace(/ü/g,'u').replace(/â/g,'a').replace(/î/g,'i').replace(/û/g,'u')}
function trNum(t){t=String(t);if(/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(t))t=t.replace(/\./g,'');return parseFloat(t.replace(',','.'))}
function p2(x){x=+x;return (x<10?'0':'')+x}
function qeDate(n){
  var d=todayISO(),rest=n,m,t=new Date();
  function ok(y,mo,da){var x=new Date(y,mo-1,da);return x.getFullYear()===y&&x.getMonth()===mo-1&&x.getDate()===da}
  if((m=/(\d{1,2})[.\/](\d{1,2})[.\/](\d{2,4})/.exec(n))){var y=+m[3];if(y<100)y+=2000;if(!ok(y,+m[2],+m[1]))return {date:null};d=y+'-'+p2(m[2])+'-'+p2(m[1]);rest=n.replace(m[0],' ')}
  else if((m=/(\d{1,2})\s+(ocak|subat|mart|nisan|mayis|haziran|temmuz|agustos|eylul|ekim|kasim|aralik)\w*(?:\s+(\d{4}))?/.exec(n))){
    var mo=['ocak','subat','mart','nisan','mayis','haziran','temmuz','agustos','eylul','ekim','kasim','aralik'].indexOf(m[2])+1,yy=m[3]?+m[3]:t.getFullYear();
    if(!ok(yy,mo,+m[1]))return {date:null};d=yy+'-'+p2(mo)+'-'+p2(m[1]);if(!m[3]&&d>todayISO())d=(yy-1)+'-'+p2(mo)+'-'+p2(m[1]);rest=n.replace(m[0],' ')}
  else if(/onceki gun|evvelsi/.test(n)){d=iso(addDays(t,-2));rest=n.replace(/onceki gun|evvelsi gun|evvelsi/,' ')}
  else if(/\bdun\b/.test(n)){d=iso(addDays(t,-1));rest=n.replace(/\bdun\b/,' ')}
  else if(/\bbugun\b/.test(n))rest=n.replace(/\bbugun\b/,' ');
  return {date:d,rest:rest};
}
function qeWords(c){return c.split(/[^a-z0-9]+/).filter(Boolean)}
function qeProd(c,unitHint){
  var w=qeWords(c),best=null,bs=0,tie=false;
  S.products.forEach(function(p){
    var sc=0;nrm(p.name).split(/[^a-z0-9]+/).filter(function(t){return t.length>=3&&!/^\d/.test(t)}).forEach(function(t){
      var st=t.slice(0,Math.max(3,Math.min(5,t.length-1)));if(w.some(function(x){return x.length>=3&&x.indexOf(st)===0}))sc++});
    var u=nrm(p.unit).slice(0,4);if(u&&w.some(function(x){return x.length>=3&&x.indexOf(u)===0}))sc+=0.5;
    if(sc>bs){bs=sc;best=p;tie=false}else if(sc===bs&&sc>0)tie=true;
  });
  return bs>=1&&!tie?best:(bs>0&&!tie?best:null);
}
function qeLoc(c){
  var gen={tesis:1,tesisi:1,icme:1,suyu:1,aritma:1,depo:1,deposu:1},w=qeWords(c),sc=[],mx=0;
  S.locations.forEach(function(l,i){var s=0;nrm(l.name).split(/[^a-z0-9]+/).filter(function(t){return /^[a-z]{4,}$/.test(t)&&!gen[t]}).forEach(function(t){var st=t.slice(0,Math.max(4,Math.min(6,t.length-1)));if(w.some(function(x){return x.length>=4&&x.indexOf(st)===0}))s++});sc.push(s);if(s>mx)mx=s});
  if(!mx)return S.locations[0].id;
  var c2=[];S.locations.forEach(function(l,i){if(sc[i]===mx)c2.push(l.id)});
  return c2.length===1?c2[0]:c2;
}
var QE_ALIM=/gel(di|diler|iyor)|alim|aldi|alin|teslim|girdi|giris|yuklen|indiril|getiril/,QE_KUL=/kullan|harcan|harca|sarf|tuketi|cikti|cikis|verdik|verildi/;
function qeParse(raw){
  var n0=nrm(raw),dd=qeDate(n0),out={date:dd.date,items:[],tube:null,unk:[],raw:raw};
  if(!dd.date){out.err='Tarihi anlayamadım. Örnek: dün, 15 kasım, 15.11.2026';return out}
  var n=dd.rest;
  if(/\btup|doluma|dolumdan|\bgaz\b/.test(n)){out.tube=qeTube(n);return out}
  var gA=QE_ALIM.test(n),gK=QE_KUL.test(n),gT=gA&&!gK?'alim':gK&&!gA?'kullanim':null;
  n.split(/[,;\n]+|\s+ve\s+/).forEach(function(c){c=c.trim();if(!c)return;
    var nums=c.match(/\d+(?:[.,]\d+)*/g)||[];
    var m=/(\d+(?:[.,]\d+)*)\s*(bidon|cuval|torba|kilogram|kilo|kg|adet)/.exec(c),qs=m?m[1]:(nums.length===1?nums[0]:null);
    var p=qeProd(c);
    if(!nums.length){if(p)out.unk.push(c);return}
    if(!qs){out.unk.push(c);return}
    var q=trNum(qs);if(!(q>0)){out.unk.push(c);return}
    var kgIn=0,kgPend=0,isKg=!!(m&&/^(kg|kilo)/.test(m[2]));
    if(isKg){if(p&&p.kg>0){kgIn=q;q=Math.round(q/p.kg*1000)/1000}else if(!p){kgPend=q}else{out.unk.push(c);return}}
    var cA=QE_ALIM.test(c),cK=QE_KUL.test(c),ty=cA&&!cK?'alim':cK&&!cA?'kullanim':gT;
    var it={clause:c,pid:p?p.id:null,type:ty,qty:q,kgIn:kgIn,kgPend:kgPend,loc:S.locations[0].id,note:undefined};
    if(kgIn&&Math.abs(q-Math.round(q))>0.0005)it.warn=fmt(kgIn)+' kg = '+fmt(q)+' '+p.unit+' ediyor, tam sayı değil. Kontrol edin.';
    if(p&&p.multi){it.loc=qeLoc(c)}
    if(m&&p&&!isKg&&nrm(p.unit).slice(0,4)!==m[2].slice(0,4)&&m[2]!=='adet')it.warn='“'+m[2]+'” yazdınız ama '+p.name+' birimi '+p.unit;
    out.items.push(it)});
  return out;
}
function qeFindCyl(tok,strict){
  if(/[.,]/.test(tok))return null;var dg=tok.replace(/\D/g,'');if(!dg)return null;
  var c0=S.cyl.filter(function(c){var sn=nrm(c.serial).replace(/[^a-z0-9]/g,''),last=(sn.match(/\d+$/)||[''])[0];
    return last===dg||(last&&last.replace(/^0+/,'')===dg.replace(/^0+/,'')&&dg.replace(/^0+/,'')!=='')||(dg.length>=(strict?3:2)&&sn.slice(-dg.length)===dg)});
  if(c0.length===1)return c0[0];if(!c0.length)return null;
  var ex=c0.filter(function(c){var sn=nrm(c.serial).replace(/[^a-z0-9]/g,'');return ((sn.match(/\d+$/)||[''])[0])===dg});
  return ex.length===1?ex[0]:'amb';
}
function qeTube(n){
  var t={dir:null,cands:[],unknown:[],kg:{},nk:0,tokens:0};
  if(/dolumdan/.test(n))t.dir='donus';else if(/doluma/.test(n))t.dir='gidis';
  else if(/gel(di|diler)|dondu|getiril/.test(n))t.dir='donus';else if(/git|gonder|yolla/.test(n))t.dir='gidis';
  var pr=/(\d{3,})\s*[-–—:=]\s*(\d+(?:[.,]\d+)?)/g,pm,pairs=[];
  while((pm=pr.exec(n)))pairs.push([pm[1],trNum(pm[2])]);
  if(pairs.length){
    pairs.forEach(function(x){var r=qeFindCyl(x[0],false);if(r==='amb'||!r){t.unknown.push(x[0]);return}
      if(t.cands.indexOf(r)<0){t.cands.push(r);if(x[1]>0)t.kg[r.id]=String(x[1]).replace('.',',')}});
    t.nk=t.cands.length;return t;
  }
  var ki=n.search(/kilo|kg|agirlik|tartim/),A=ki>=0?n.slice(0,ki):n,B=ki>=0?n.slice(ki):'',re=/\d+(?:[.,]\d+)?/g,m,sers=[],kgs=[];
  if(ki>=0){while((m=re.exec(A)))sers.push(m[0]);re.lastIndex=0;while((m=re.exec(B)))kgs.push(trNum(m[0]))}
  else{var all=[];while((m=re.exec(n)))all.push(m[0]);all.forEach(function(tok){var r=qeFindCyl(tok,true);if(r)sers.push(tok);else kgs.push(trNum(tok))})}
  sers.forEach(function(tok){var r=qeFindCyl(tok,ki<0);if(r==='amb'||!r){t.unknown.push(tok);return}if(t.cands.indexOf(r)<0)t.cands.push(r)});
  t.nk=kgs.length;
  if(kgs.length&&kgs.length===t.cands.length)t.cands.forEach(function(c,i){if(kgs[i]>0)t.kg[c.id]=String(kgs[i]).replace('.',',')});
  return t;
}
function qeElig(t){
  var ok=[],skip=[];t.cands.forEach(function(c){
    if(t.dir==='gidis'){if(c.status==='doluma')skip.push({c:c,why:'zaten doluma gitmiş görünüyor'});else ok.push(c)}
    else if(t.dir==='donus'){if(c.status!=='doluma')skip.push({c:c,why:'doluma gönderilmemiş görünüyor'});else ok.push(c)}
    else ok.push(c)});
  return {ok:ok,skip:skip};
}
function qeNeed(f){
  for(var i=0;i<f.items.length;i++){var it=f.items[i];
    if(!it.pid)return {k:'prod',i:i};
    if(!it.type)return {k:'type',i:i};
    if(typeof it.loc!=='string')return {k:'loc',i:i};}
  if(f.tube&&!f.tube.dir)return {k:'dir'};
  if(f.items.some(function(it){return it.type==='alim'&&it.note===undefined}))return {k:'firm'};
  return null;
}

function qeStockLines(f){

    return '<div class="qe-it"><div><b>'+esc(p.name)+'</b> <span class="spill st-'+(it.type==='alim'?'dolu':'kullanimda')+'">'+(it.type==='alim'?'Alım':'Kullanım')+'</span></div><div class="muted" style="margin-top:4px">'+fmt(it.qty)+' '+esc(p.unit)+(p.kg>0?' · '+fmt(kgOf(p,it.qty))+' kg':'')+(p.multi?' · '+esc(lname(it.loc)):'')+(it.note?' · Firma: '+esc(it.note):'')+'</div>'+(it.warn?'<p class="hint" style="margin:6px 0 0">'+esc(it.warn)+'</p>':'')+qeBig(it,p)+'</div>'}).join('');
}
function qeBig(it,p){
  if(it.type!=='kullanim')return '';var mx=0,nq=0;movesOf(p.id).filter(function(x){return x.type==='kullanim'}).slice(0,60).forEach(function(x){nq++;if(x.qty>mx)mx=x.qty});
  return nq>=5&&it.qty>mx*2?'<p class="hint" style="margin:6px 0 0">Bu miktar son kullanımların en büyüğünden ('+fmt(mx)+') çok fazla. Kontrol edin.</p>':'';
}

  return sheetFrame('Kontrol edin','<form id="sf" novalidate>'+inner+'<div style="height:10px"></div>'+errBox(s)+'<div class="acts"><button type="button" class="btn" data-a="qeback">Geri</button><button type="submit" class="btn pri">'+(f.ok?'Yine de kaydet':'Kaydet ('+n+' kayıt)')+'</button></div></form>');

function qeSubmit(){
  var s=U.sheet,f=s.f;
  if(!f.parsed){
    var el=$('#qe-text'),tx=el?el.value.trim():'';if(!tx)return err('Bir şey yazın.');
    var r=qeParse(tx);if(r.err){f.text=tx;return err(r.err)}
    f.text=tx;f.parsed=true;f.date=r.date;f.items=r.items;f.tube=r.tube;f.unk=r.unk;f.ok=false;f.err='';s.err='';renderSheet();return;
  }
  var need=qeNeed(f);
  if(need&&need.k==='firm'){var fi=$('#qe-firm');f.items.forEach(function(it){if(it.type==='alim'&&it.note===undefined)it.note=fi?fi.value.trim():''});renderSheet();return}
  if(need)return;
  if(!f.date)return err('Tarihi girin.');if(f.date>todayISO())return err('İleri tarih girilemez.');
  var moves=S.moves.slice(),base=Date.now(),added=[];
  f.items.forEach(function(it,i){var p=P(it.pid);moves.push({id:uid(),ts:base+i,date:f.date,type:it.type,productId:p.id,qty:it.qty,from:it.type==='kullanim'?it.loc:null,to:it.type==='alim'?it.loc:null,note:it.note||''})});
  if(f.items.length){var v=validate(moves);if(v)return err(stockErr(v))}
  var ship=null;
  if(f.tube){var t=f.tube,e=qeElig(t),items=[],warn=[];
    for(var i=0;i<e.ok.length;i++){var c=e.ok[i],kg=parseNum(t.kg[c.id]);if(!(kg>0))return err(c.serial+' için kiloyu girin.');
      if(t.dir==='donus'){var pk=prevOutKg(c.id,f.date);if(pk!=null&&kg<=pk)warn.push(c.serial)}items.push({cid:c.id,kg:kg})}
    if(warn.length&&!f.ok){f.ok=true;err(warn.join(', ')+' için geliş kilosu gidiş kilosundan düşük ya da eşit görünüyor. Kontrol edin, doğruysa "Yine de kaydet"e basın.');renderSheet();return}
    if(items.length)ship={id:'g'+uid(),ts:base+99,dir:t.dir,date:f.date,items:items};
  }
  var snap=JSON.stringify(S),cnt=f.items.length;
  S.moves=moves;
  if(ship){S.ships.push(ship);ship.items.forEach(function(it){setCylSt(S.cyl.find(function(c){return c.id===it.cid}),ship.dir==='gidis'?'doluma':'dolu')});cnt+=ship.items.length}
  persist();U.sheet=null;renderSheet();render();toast(cnt+' kayıt eklendi',snap);
}

function renderSheet(first){
  var L=$('#layer'),s=U.sheet,prev=0;
  document.documentElement.classList.toggle('lock',!!s);
  if(!s){L.innerHTML='';return}
  var old=L.querySelector&&L.querySelector('.sheet');if(old)prev=old.scrollTop;
  L.innerHTML='<div class="scrim" data-a="close"></div><section class="sheet'+(first?' in':'')+'" role="dialog" aria-modal="true">'+SHEETS[s.kind](s)+'</section>';
  var nw=L.querySelector&&L.querySelector('.sheet');if(nw&&prev)nw.scrollTop=prev;
  if(s.kind==='move')updateHint();

/* taslak kaydı: 'draft' yalnız saklar; 'print' tutanağı hazırlayıp yazdırma ekranını açar */
function shipDraftSave(mode){
  var s=U.sheet;if(!s||(s.kind!=='gidis'&&s.kind!=='donus'))return;
  var F=s.f,info=shipInfoOf(F),ids=Object.keys(F.sel).filter(function(k){return F.sel[k]&&S.cyl.some(function(c){return c.id===k})});
  if(!F.date)return err('Tarihi girin.');
  if(mode==='print'){
    if(!ids.length)return err('Tutanak için en az bir tüp seçin.');
    var ie=shipInfoErr(info);if(ie)return err(ie);
  }
  var taken=shipDraftsTaken(s.id||null);
  if(ids.some(function(k){return taken[k]}))return err('Bazı tüpler başka bir yarım kalan kayıtta. Onları çıkarın.');
  var items=ids.map(function(k){var kg=parseNum(F.kg[k]);return {cid:k,kg:kg>0?kg:null}});
  shipInfoSave(info);
  var d=s.id?(S.shipDrafts||[]).find(function(x){return x.id===s.id}):null;
  if(!d){d={id:'sd'+uid(),ts:Date.now(),dir:s.kind,date:F.date,items:items,tut:{docs:[]}};S.shipDrafts.push(d);s.id=d.id}
  else{d.date=F.date;d.items=items;if(!d.tut)d.tut={docs:[]};if(!d.tut.docs)d.tut.docs=[]}
  if(F.evrakManual&&F.evrak)d.evrak=F.evrak;else delete d.evrak;
  if(mode==='print'){
    d.tut.snap=tutShipSnap(d);persist();
    tutView(d.tut.snap,s);
    toast('Tutanak hazır. Yazdırıp imzalatın, imzalı belgeyi yükleyip kaydedin.');
    return;
  }
  persist();U.sheet=null;renderSheet();render();toast('Taslak kaydedildi. Hareketler\'de bulabilirsiniz.');
}
function shipSubmit(){var s=U.sheet;if(!s)return;if(s.id)saveShip();else shipDraftSave('draft')}
/* kayıt tamamlama: tüp kiloları girilmiş, eligible tüpler stoğa işlenir; taslak varsa tutanak ve belgeleri taşınır */
function saveShip(){
  var s=U.sheet,F=s.f,out=s.kind==='gidis';
  var ids=Object.keys(F.sel).filter(function(k){return F.sel[k]});
  if(!ids.length)return err('En az bir tüp seçin.');
  if(!F.date)return err('Tarihi girin.');
  var info=shipInfoOf(F),ie=shipInfoErr(info);if(ie)return err(ie);
  var taken=shipDraftsTaken(s.id||null),items=[],warn=[];
  for(var i=0;i<ids.length;i++){
    var c=S.cyl.find(function(x){return x.id===ids[i]});
    if(!c)return err('Tüp bulunamadı. Sayfayı yenileyip tekrar deneyin.');
    if(taken[c.id])return err(c.serial+' başka bir yarım kalan kayıtta. Önce o kaydı tamamlayın ya da tüpü çıkarın.');
    if(out?c.status!=='bos':c.status!=='doluma')return err(c.serial+' şu an bu işleme uygun değil ('+ST[c.status]+').');
    var kg=parseNum(F.kg[ids[i]]);
    if(!(kg>0))return err(c.serial+' için kiloyu girin.');
    if(!out){var pk=prevOutKg(c.id,F.date);if(pk!=null&&kg<=pk)warn.push(c.serial)}
    items.push({cid:c.id,kg:kg});
  }
  if(warn.length&&!F.ok){F.ok=true;err(warn.join(', ')+' için geliş kilosu gidiş kilosundan düşük ya da eşit görünüyor. Kontrol edin, doğruysa "Yine de kaydet"e basın.');renderSheet();return}
  shipInfoSave(info);
  var dr=s.id?(S.shipDrafts||[]).find(function(x){return x.id===s.id}):null;
  var shN={id:'g'+uid(),ts:dr?dr.ts:Date.now(),dir:out?'gidis':'donus',date:F.date,items:items,tut:dr&&dr.tut?dr.tut:{docs:[]}};
  if(F.evrakManual&&F.evrak)shN.evrak=F.evrak;
  if(!shN.tut.docs)shN.tut.docs=[];
  shN.tut.snap=tutShipSnap(shN);
  if(dr){S.shipDrafts=S.shipDrafts.filter(function(x){return x.id!==dr.id});tombAdd(dr.id)}
  S.ships.push(shN);
  items.forEach(function(it){setCylSt(S.cyl.find(function(c){return c.id===it.cid}),out?'doluma':'dolu')});
  persist();U.sheet={kind:'ship',id:shN.id,ask:false};renderSheet(true);render();toast(out?items.length+' tüp doluma gönderildi':items.length+' tüp dolu olarak alındı');
}
function delShip(){
  var s=U.sheet;
  var dr=s.id?(S.shipDrafts||[]).find(function(x){return x.id===s.id}):null;
  if(dr){S.shipDrafts=S.shipDrafts.filter(function(x){return x.id!==dr.id});tombAdd(dr.id);persist();U.sheet=null;renderSheet();render();toast('Taslak silindi');return}
  var sh=S.ships.find(function(x){return x.id===s.id});if(!sh)return;
  S.ships=S.ships.filter(function(x){return x.id!==sh.id});tombAdd(sh.id);
  sh.items.forEach(function(it){var c=S.cyl.find(function(x){return x.id===it.cid});if(!c)return;if(sh.dir==='gidis'&&c.status==='doluma')setCylSt(c,'bos');else if(sh.dir==='donus'&&c.status==='dolu')setCylSt(c,'doluma')});
  persist();U.sheet=null;renderSheet();render();toast('Kayıt silindi');
}
function copyText(t){
  function legacy(){var ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;opacity:0;top:0';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,t.length);var ok=false;try{ok=document.execCommand('copy')}catch(e){}ta.remove();return ok}
  try{return navigator.clipboard.writeText(t).then(function(){return true},function(){return legacy()})}catch(e){return Promise.resolve(legacy())}
}

var csvCell=function(v){v=String(v);return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
function buildCsv(){
  var R=U.r,range=periodRange(R.period,R.anchor),head,rows;
  if(U.mod==='gaz'){
    var D=gazData(range);head=['Tarih','Yön','Tüp','Kilo (kg)','Dolan klor (kg)'];
    rows=D.rows.map(function(r){return [r.s.date,r.s.dir==='gidis'?'Doluma gitti':'Dolumdan geldi',r.serial,String(r.kg).replace('.',','),r.net!=null?String(Math.round(r.net*10)/10).replace('.',','):''].map(csvCell).join(';')});
  }else{
    var p=curP(),ms=movesOf(p.id).filter(function(m){return m.date>=range.s&&m.date<=range.e&&(R.loc==='all'||m.from===R.loc||m.to===R.loc)&&(R.type==='all'||m.type===R.type)});
    head=['Tarih','Tür','Ürün','Miktar','Birim','Kilo (kg)','Nereden','Nereye','Not'];
    rows=sortMoves(ms).map(function(m){return [m.date,T[m.type].n,p.name,String(m.qty).replace('.',','),p.unit,p.kg>0?String(kgOf(p,m.qty)).replace('.',','):'',m.from?lname(m.from):'',m.to?lname(m.to):'',m.note||''].map(csvCell).join(';')});
  }
  return [head.join(';')].concat(rows).join('\n');
}
