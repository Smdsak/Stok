<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B6B80"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Stok Takip"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="icon-192.png">
<style>[hidden]{display:none!important}:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<script src="config.js"></script></head><body>
<title>Tesis Stok Takip</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Düzen: sabit alt sekme çubuğu, üstte sade uygulama çubuğu ve ürün sekmeleri, ince çizgili düz kartlar. Tek vurgu rengi (Okyanus, Lacivert ya da Zümrüt); hareket renkleri sabit kimliktir. Sayılar kolonlarda tabular, büyük rakamlarda orantılı. */
:root{
  --bg:#F1F4F6; --surface:#FFFFFF; --surface2:#F0F3F5; --fg:#0E1C24; --muted:#586A76; --line:#DCE3E8; --grid:#E8EDF0; --axis:#C5CFD6;
  --accent:#0B6B80; --accent-fg:#FFFFFF; --accent-soft:#E0F0F4;
  --c-alim:#1baf7a; --c-kul:#eb6834; --c-tr:#6250d6; --c-duz:#8A9BA5;
  --alim:#14724C; --alim-soft:#DDF1E8; --kul:#B04A12; --kul-soft:#FBE8D8; --tr:#5B4BC4; --tr-soft:#E9E6F8; --duz:#5E7078; --duz-soft:#E4EAEC;
  --danger:#C23B2D; --danger-soft:#FBE4E0;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A171C; --surface:#10232A; --surface2:#162E36; --fg:#E7F0F2; --muted:#8FA8B0; --line:#223D46; --grid:#1B343C; --axis:#2E4C57;
  --accent:#4DBAD0; --accent-fg:#062A31; --accent-soft:#12363F;
  --c-alim:#199e70; --c-kul:#d95926; --c-tr:#9085e9; --c-duz:#7C919A;
  --alim:#4CC38A; --alim-soft:#123A29; --kul:#F0A93B; --kul-soft:#402C0F; --tr:#A596F2; --tr-soft:#29244F; --duz:#9DB3BA; --duz-soft:#1F3236;
  --danger:#F08070; --danger-soft:#43211C; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0A171C; --surface:#10232A; --surface2:#162E36; --fg:#E7F0F2; --muted:#8FA8B0; --line:#223D46; --grid:#1B343C; --axis:#2E4C57;
  --accent:#4DBAD0; --accent-fg:#062A31; --accent-soft:#12363F;
  --c-alim:#199e70; --c-kul:#d95926; --c-tr:#9085e9; --c-duz:#7C919A;
  --alim:#4CC38A; --alim-soft:#123A29; --kul:#F0A93B; --kul-soft:#402C0F; --tr:#A596F2; --tr-soft:#29244F; --duz:#9DB3BA; --duz-soft:#1F3236;
  --danger:#F08070; --danger-soft:#43211C; color-scheme:dark;}

:root[data-accent="navy"]{--accent:#2C5AA8;--accent-fg:#FFFFFF;--accent-soft:#E0E8F6}
@media (prefers-color-scheme:dark){:root[data-accent="navy"]:not([data-theme="light"]){--accent:#86AEF2;--accent-fg:#0A1B36;--accent-soft:#17294A}}
:root[data-accent="navy"][data-theme="dark"]{--accent:#86AEF2;--accent-fg:#0A1B36;--accent-soft:#17294A}
:root[data-accent="emerald"]{--accent:#1B7A5A;--accent-fg:#FFFFFF;--accent-soft:#DAF0E6}
@media (prefers-color-scheme:dark){:root[data-accent="emerald"]:not([data-theme="light"]){--accent:#52D2A3;--accent-fg:#062A1E;--accent-soft:#12392C}}
:root[data-accent="emerald"][data-theme="dark"]{--accent:#52D2A3;--accent-fg:#062A1E;--accent-soft:#12392C}

*{box-sizing:border-box}
html.lock,html.lock body{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--fg);font:15.5px/1.5 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 130px;
  -webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer;-webkit-tap-highlight-color:transparent}
h1,h2,h3,p{margin:0}
.app{max-width:680px;margin:0 auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.view.in{animation:vin .28s ease-out both}
@keyframes vin{from{opacity:0;transform:translateY(6px)}}

/* uygulama çubuğu */
.appbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 12px}
.appbar-l{display:flex;align-items:center;gap:11px;min-width:0}
.mark{width:36px;height:36px;border-radius:9px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;flex:none}
.appbar-t{display:block;font-size:17px;font-weight:600;letter-spacing:-.01em;line-height:1.15}
.appbar small{display:block;font-size:12.5px;color:var(--muted);line-height:1.3}
.appbar-r{text-align:right;flex:none}
.appbar-r small:first-child{color:var(--fg);font-weight:500}

.mods{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:0 max(16px,env(safe-area-inset-left,0px))}
.ptabs{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none}
.ptabs::-webkit-scrollbar{display:none}
.pt{flex:none;background:none;border:0;border-bottom:2px solid transparent;padding:11px 0 10px;font-size:15px;font-weight:500;color:var(--muted);white-space:nowrap;margin-bottom:-1px}
.pt[aria-pressed="true"]{color:var(--fg);font-weight:600;border-bottom-color:var(--accent)}

.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:8px;font-weight:500;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg);font-weight:600}

.notes{display:flex;flex-direction:column;gap:8px;margin:14px 0 0}
.note{background:var(--accent-soft);border-radius:10px;padding:10px 13px;font-size:13.5px}
.note.bad{background:var(--danger-soft);color:var(--danger)}
.note.warn{background:var(--kul-soft);color:var(--kul)}
.link{background:none;border:0;padding:6px 0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}

.stack{display:flex;flex-direction:column;gap:12px;padding-top:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.card.flush{padding:4px 16px}
.h{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.hd .h{margin:0}
.hrow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.big{font:600 56px/1 var(--f-body);letter-spacing:-.025em;margin-top:8px}
.big .u{font:500 15px var(--f-body);color:var(--muted);margin-left:8px;letter-spacing:0}
.eq{font-size:13.5px;color:var(--muted);margin-top:4px}
.pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:6px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--alim-soft);color:var(--alim)}
.pill.warn{background:var(--kul-soft);color:var(--kul)}
.pill.bad{background:var(--danger-soft);color:var(--danger)}
.cover{margin-top:10px;font-size:13.5px;color:var(--muted)}
.note-s{font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.45}

/* ölçü hücreleri */
.kvs{display:grid;grid-template-columns:1fr 1fr;margin:14px -16px -16px;border-top:1px solid var(--line)}
.kvs.in{margin:0}
.kv{padding:12px 16px;border-bottom:1px solid var(--line);min-width:0}
.kv:nth-child(odd){border-right:1px solid var(--line)}
.kvs>.kv:nth-last-child(-n+2):nth-child(odd),.kvs>.kv:last-child{border-bottom:0}
.kvs>.kv:nth-last-child(2):nth-child(odd){border-bottom:0}
.kv small{display:block;font-size:12px;color:var(--muted);line-height:1.3}
.kv b{display:block;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em;margin-top:2px}
.kv b .u{font-size:12.5px;font-weight:500;color:var(--muted);margin-left:4px}
.kv>span{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
.up,.dn{white-space:nowrap}

/* konum çubukları */
.lrow+.lrow{margin-top:12px}
.lt{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:5px}
.lt b{font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.rk{display:flex;flex-direction:column;gap:11px}
.rk-r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:baseline;font-size:14px}
.rk-n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk-v{font-variant-numeric:tabular-nums;font-weight:600}
.rk-b{grid-column:1/-1;height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.rk-b i{display:block;height:100%;border-radius:3px;background:var(--c-kul)}

.list{display:flex;flex-direction:column}
.row{--t:var(--fg);--t-soft:var(--surface2);display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:10px 0;background:none;border:0;border-top:1px solid var(--line);text-align:left}
.row:active{background:var(--surface2)}
.list>.row:first-child,.dh+.row{border-top:0}
.badge{width:38px;height:38px;border-radius:9px;background:var(--t-soft);color:var(--t);display:grid;place-items:center;flex:none}
.rt{flex:1;min-width:0;display:flex;flex-direction:column}
.rt b{font-weight:600}
.rt small,.rq small{font-size:12.5px;color:var(--muted)}
.rt small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rq{display:flex;flex-direction:column;align-items:flex-end;flex:none}
.rq b{font-size:18px;font-weight:600;color:var(--t);font-variant-numeric:tabular-nums}
.dh{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:14px 0 6px}
.dh:first-child{padding-top:10px}
.t-alim{--t:var(--alim);--t-soft:var(--alim-soft)}
.t-kullanim{--t:var(--kul);--t-soft:var(--kul-soft)}
.t-transfer{--t:var(--tr);--t-soft:var(--tr-soft)}
.t-duzeltme,.t-gidis{--t:var(--duz);--t-soft:var(--duz-soft)}
.t-donus{--t:var(--alim);--t-soft:var(--alim-soft)}
.t-degisim{--t:var(--accent);--t-soft:var(--accent-soft)}
.st-kullanimda{--t:var(--accent);--t-soft:var(--accent-soft)}
.st-yedek{--t:var(--tr);--t-soft:var(--tr-soft)}
.st-dolu{--t:var(--alim);--t-soft:var(--alim-soft)}
.st-bos{--t:var(--kul);--t-soft:var(--kul-soft)}
.st-doluma{--t:var(--duz);--t-soft:var(--duz-soft)}
.spill{font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:6px;background:var(--t-soft);color:var(--t);white-space:nowrap}
.empty{padding:22px 8px;text-align:center;color:var(--muted);font-size:14px}
.empty.small{padding:28px 8px}
.more{margin:12px auto 0;display:block}

.sgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px}
.stile{--t:var(--fg);--t-soft:var(--surface2);grid-column:span 2;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px 8px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stile:nth-child(n+4){grid-column:span 3}
.stile[aria-pressed="true"]{background:var(--t-soft);border-color:var(--t)}
.sl{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sl::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--t);flex:none}
.stile b{font-size:30px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}

.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:15px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{background:var(--surface2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.dng{color:var(--danger);border-color:var(--danger)}
.btn.sm{min-height:38px;font-size:14px;padding:0 12px}

.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg-p{display:flex;background:var(--surface2);border-radius:10px;padding:3px;gap:3px;margin-bottom:12px}
.seg-p button{flex:1;border:0;background:none;border-radius:8px;min-height:36px;font-weight:600;font-size:14px;color:var(--muted)}
.seg-p button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 0 0 1px var(--line)}
.navp{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.navp b{font-size:16px;font-weight:600}
.iconbtn{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.iconbtn:disabled{opacity:.35}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile small{display:block;font-size:12px;color:var(--muted);letter-spacing:.02em}
.tile b{display:block;font-size:26px;font-weight:600;line-height:1.15;margin:3px 0 1px;letter-spacing:-.015em}
.tile span{font-size:12.5px;color:var(--muted)}
.filters{display:flex;flex-direction:column;gap:10px}
.filters select{width:100%}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.legend i.l{width:14px;height:3px;border-radius:2px;vertical-align:middle}
.bg-alim{background:var(--c-alim)}.bg-kullanim{background:var(--c-kul)}.bg-transfer{background:var(--c-tr)}.bg-duzeltme{background:var(--c-duz)}.bg-stok{background:var(--accent)}
.tablewrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
.tbl{border-collapse:collapse;width:100%;min-width:520px;font-size:13.5px}
.tbl th{font-size:11.5px;font-weight:600;color:var(--muted);text-align:right;padding:6px 8px;white-space:nowrap}
.tbl td{padding:9px 8px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);padding-left:0}
.tbl tr.tot td{font-weight:600}
.dim{color:var(--muted)}
.ledger{width:100%;border-collapse:collapse;font-size:14.5px;margin-top:14px}
.ledger td{padding:9px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.ledger td:first-child{width:22px;color:var(--muted);text-align:center}
.ledger td:last-child{text-align:right;font-weight:600}
.ledger tr.sum td{border-top:2px solid var(--fg);font-weight:600;padding-top:11px}
.ledger tr.sum td:first-child{color:var(--fg)}
.tv{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.tv summary{font-size:13px;color:var(--muted);cursor:pointer;padding:4px 0;list-style:none}
.tv summary::before{content:"▸ ";}
.tv[open] summary::before{content:"▾ ";}
.tv .tablewrap{max-height:260px;overflow:auto}

/* grafik */
.cv{position:relative;touch-action:pan-y;outline-offset:2px;user-select:none;-webkit-user-select:none}
.chart{display:block;width:100%;height:auto}
.gl{stroke:var(--grid);stroke-width:1}
.axl{stroke:var(--axis);stroke-width:1}
.ax{fill:var(--muted);font:10px var(--f-body)}
.vl{fill:var(--fg);font:600 11px var(--f-body)}
.ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.ar{fill:var(--accent);fill-opacity:.1}
.crit{stroke:var(--danger);stroke-width:1}
.dotm{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.tri{fill:var(--c-alim);stroke:var(--surface);stroke-width:2;paint-order:stroke}
.cx{stroke:var(--muted);stroke-width:1;pointer-events:none}
.cd{fill:var(--accent);stroke:var(--surface);stroke-width:2;pointer-events:none}
.hit{fill:transparent;cursor:crosshair}
.s-total{fill:var(--accent)}.s-up{fill:var(--c-alim)}.s-down{fill:var(--c-kul)}.s-tr{fill:var(--c-tr)}.s-adj{fill:var(--c-duz)}
.s-alim{fill:var(--c-alim)}.s-kullanim{fill:var(--c-kul)}.s-aralik{fill:var(--accent)}
.bg-g.on rect{opacity:.78}
.avgl{stroke:var(--muted);stroke-width:1}
.cv-tip{position:absolute;top:2px;pointer-events:none;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12.5px;box-shadow:0 8px 22px rgba(0,0,0,.16);min-width:132px;max-width:230px;z-index:3}
.cv-tip .tt{font-weight:600;margin-bottom:4px}
.cv-tip .tr{display:flex;align-items:center;justify-content:space-between;gap:12px;line-height:1.6}
.cv-tip .tr span{display:flex;align-items:center;gap:7px;color:var(--muted)}
.cv-tip .tr i{width:11px;height:3px;border-radius:2px;flex:none}
.cv-tip .tr b{font-variant-numeric:tabular-nums;font-weight:600}

/* sekme çubuğu */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);
  padding:0 max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px))}
.tabbar button{position:relative;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:500;color:var(--muted);padding:9px 0 8px;min-width:0}
.tabbar button[aria-current="page"]{color:var(--accent);font-weight:600}
.tabbar button[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:50%;width:30px;height:2px;margin-left:-15px;background:var(--accent)}
.fab{position:fixed;z-index:19;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(72px + env(safe-area-inset-bottom,0px));min-height:50px;padding:0 18px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-fg);font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:8px;box-shadow:0 6px 18px rgba(0,0,0,.28)}

.scrim{position:fixed;inset:0;background:rgba(4,16,20,.55);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:680px;z-index:41;max-height:92vh;max-height:92dvh;overflow-y:auto;background:var(--surface);border-radius:16px 16px 0 0;
  padding:8px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.sheet.in{animation:up .24s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 12px}
.sh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
.sh h2{font-size:19px;font-weight:600;letter-spacing:-.01em}
.x{width:40px;height:40px;border-radius:10px;border:0;background:var(--surface2);display:grid;place-items:center}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}

function dlong(s){if(s===todayISO())return 'Bugün';if(s===iso(addDays(new Date(),-1)))return 'Dün';var d=parse(s);var y=d.getFullYear()!==new Date().getFullYear();return DAYFULL[d.getDay()]+', '+d.getDate()+' '+MONTHS[d.getMonth()]+(y?' '+d.getFullYear():'')}

function sampleData(){
  var r=11;var rnd=function(){r=(r*16807)%2147483647;return r/2147483647};
  var n=0,moves=[];
  var add=function(date,type,pid,from,to,qty,note){n++;moves.push({id:'s'+n,ts:parse(date).getTime()+n,date:date,type:type,productId:pid,qty:qty,from:from,to:to,note:note})};
  var end=new Date();end.setHours(0,0,0,0);
  var days=[];for(var i=420;i>=0;i--)days.push(iso(addDays(end,-i)));
  var deps=['l2','l3','l4','l5'];
  var b={l1:0,l2:0,l3:0,l4:0,l5:0};
  var A=function(ds,t,f,to,q,note){add(ds,t,'p1',f,to,q,note);if(f)b[f]-=q;if(to)b[to]+=q};
  days.forEach(function(ds,i){
    if(i%21===0)A(ds,'alim',null,'l1',[35,40,45][Math.floor(rnd()*3)],'Tedarikçi teslimatı');
    if(i%7===3)deps.forEach(function(l){if(rnd()<0.7){var q=2+Math.floor(rnd()*3);if(b.l1>=q+3)A(ds,'transfer','l1',l,q,'')}});
    if(rnd()<0.7){var q1=rnd()<0.2?2:1;if(b.l1>=q1)A(ds,'kullanim','l1',null,q1,rnd()<0.3?'Havuz dozajı':'')}
    deps.forEach(function(l){if(rnd()<0.28&&b[l]>=1)A(ds,'kullanim',l,null,1,'')});
  });
  if(sum(b)<25)A(days[days.length-1],'alim',null,'l1',40,'Tedarikçi teslimatı');
  [['p2',0.75,[1,1,2],24,25],['p3',0.6,[1,2],28,25]].forEach(function(c){
    var bal=0;
    days.forEach(function(ds,i){
      if(i%c[3]===0){add(ds,'alim',c[0],null,'l1',c[4],'Sevkiyat');bal+=c[4]}
      if(rnd()<c[1]){var q=c[2][Math.floor(rnd()*c[2].length)];if(bal>=q){add(ds,'kullanim',c[0],'l1',null,q,'');bal-=q}}
    });
  });
  var cyl=[];for(var k=1;k<=10;k++)cyl.push({id:'c'+k,serial:'GK-24'+pad(k),status:'dolu'});
  var ships=[],ptr=0,sn=0;
  for(var j=0;j<11;j++){
    var off=j<10?-400+38*j:-3;
    var gd=iso(addDays(end,off));var cnt=3+(j%2);var items=[];
    for(var q2=0;q2<cnt;q2++){items.push({cid:cyl[(ptr++)%10].id,kg:Math.round((42+rnd()*3)*10)/10})}
    sn++;ships.push({id:'g'+sn,ts:parse(gd).getTime()+sn,dir:'gidis',date:gd,items:items});
    if(j<10){
      var rd=iso(addDays(end,off+4));sn++;
      ships.push({id:'g'+sn,ts:parse(rd).getTime()+sn,dir:'donus',date:rd,items:items.map(function(it){return {cid:it.cid,kg:Math.round((it.kg+49+rnd()*2)*10)/10}})});
    }
  }
  var out={};ships[ships.length-1].items.forEach(function(it){out[it.cid]=1});
  var pat=['kullanimda','kullanimda','yedek','yedek','dolu','bos','bos'],pi=0;
  cyl.forEach(function(c){if(out[c.id])c.status='doluma';else c.status=pat[pi++%pat.length]});
  return {moves:moves,cyl:cyl,ships:ships};
}

}

/* Google Drive eşitlemesi (GitHub Pages sürümü) */
var DRIVE_FILE='stok-takip-veri.json',DK='tesis-cloud-hash';
var CLOUD={db:null,state:'wait',at:null,err:null,conflict:false,ok:false,pending:null,token:null,tokExp:0,fileId:null,busy:false,checked:false,tc:null,again:false},cloudT=null;
function cfg(){return (typeof window!=='undefined'&&window.STOK_CONFIG)||{}}
function cloudAt(){try{return Number(localStorage.getItem(CK))||0}catch(e){return 0}}
function cloudSetAt(v){try{localStorage.setItem(CK,String(v))}catch(e){}}
function hashOf(str){var h=5381,i;for(i=0;i<str.length;i++)h=((h<<5)+h+str.charCodeAt(i))|0;return String(h)+':'+str.length}
function getHash(){try{return localStorage.getItem(DK)||''}catch(e){return ''}}
function setHash(h){try{localStorage.setItem(DK,h)}catch(e){}}
function isDirty(){return hashOf(JSON.stringify(S))!==getHash()}
function cloudChip(){
  var st=CLOUD.state,c='',t='',a='';
  if(CLOUD.conflict){c='warn';t='Çakışma';a=' data-a="tab" data-t="ayar"'}
  else if(st==='giris'){c='warn';t='Drive\'a bağlan';a=' data-a="driveconnect"'}
  else if(st==='baglaniyor'){c='';t='Bağlanıyor…'}
  else if(st==='yaziyor'){c='';t='Kaydediliyor…'}
  else if(st==='cevrimdisi'){c='warn';t='Çevrimdışı · sırada'}
  else if(st==='hata'){c='bad';t='Drive hatası';a=' data-a="tab" data-t="ayar"'}
  else if(st==='hazir'&&CLOUD.ok){c='ok';t='Drive ✓ '+tm(CLOUD.at||Date.now())}
  else if(st==='kurulum'){c='';t='Yalnız bu telefonda'}
  else return '<span id="cchip"></span>';
  return '<button type="button" id="cchip" class="cchip '+c+'"'+a+'>'+t+'</button>';
}
function updateChip(){var el=typeof document!=='undefined'&&document.getElementById('cchip');if(el)el.outerHTML=cloudChip()}
function cloudInit(done){
  var id=cfg().googleClientId;
  if(!id||/BURAYA|YOUR/i.test(id)){CLOUD.state='kurulum';updateChip();if(done)done();return}
  CLOUD.db=true;CLOUD.state='giris';
  try{
    if(typeof document!=='undefined'&&!(window.google&&window.google.accounts)){
      var sc=document.createElement('script');sc.src='https://accounts.google.com/gsi/client';sc.async=true;
      sc.onload=function(){CLOUD.gsi=true;cloudCheck()};sc.onerror=function(){CLOUD.state='cevrimdisi';updateChip()};
      document.head.appendChild(sc);
    }else CLOUD.gsi=true;
  }catch(e){}
  if(done)done();
}
function getToken(interactive){
  return new Promise(function(res,rej){
    if(CLOUD.token&&Date.now()<CLOUD.tokExp-60000)return res(CLOUD.token);
    if(!(window.google&&window.google.accounts&&window.google.accounts.oauth2))return rej({code:'gsi'});
    if(!CLOUD.tc)CLOUD.tc=window.google.accounts.oauth2.initTokenClient({
      client_id:cfg().googleClientId,scope:'https://www.googleapis.com/auth/drive.file',
      callback:function(r){if(r&&r.access_token){CLOUD.token=r.access_token;CLOUD.tokExp=Date.now()+(r.expires_in||3600)*1000;if(CLOUD.pr)CLOUD.pr(r.access_token)}else if(CLOUD.pj)CLOUD.pj({code:'auth'})},
      error_callback:function(){if(CLOUD.pj)CLOUD.pj({code:'auth'})}
    });
    CLOUD.pr=res;CLOUD.pj=rej;
    try{CLOUD.tc.requestAccessToken({prompt:interactive?'':'none'})}catch(e){rej({code:'auth'})}
  });
}
function dfetch(url,opt){
  return getToken(false).then(function(t){
    opt=opt||{};opt.headers=Object.assign({Authorization:'Bearer '+t},opt.headers||{});
    return fetch(url,opt);
  }).then(function(r){
    if(r.status===401){CLOUD.token=null;throw {code:'auth'}}
    if(!r.ok)throw {code:'http'+r.status};
    return r;
  });
}
function findFile(){
  return dfetch('https://www.googleapis.com/drive/v3/files?spaces=drive&fields='+encodeURIComponent('files(id,modifiedTime)')+'&orderBy='+encodeURIComponent('modifiedTime desc')+'&q='+encodeURIComponent("name='"+DRIVE_FILE+"' and trashed=false"))
    .then(function(r){return r.json()}).then(function(j){var f=(j.files||[])[0]||null;CLOUD.fileId=f?f.id:null;return f});
}
function createFile(){
  return dfetch('https://www.googleapis.com/drive/v3/files?fields=id',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:DRIVE_FILE,mimeType:'application/json'})})
    .then(function(r){return r.json()}).then(function(j){CLOUD.fileId=j.id});
}
function writeFile(text){
  return dfetch('https://www.googleapis.com/upload/drive/v3/files/'+CLOUD.fileId+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body:text});
}
function readRemote(){
  return findFile().then(function(f){
    if(!f)return null;
    return dfetch('https://www.googleapis.com/drive/v3/files/'+f.id+'?alt=media').then(function(r){return r.text()}).then(function(t){
      if(!t||!t.trim())return null;var w=JSON.parse(t);return {at:w.savedAt||0,d:w.data}
    });
  });
}
function cloudRead(cb){
  if(!CLOUD.db||!CLOUD.token)return cb(null);
  readRemote().then(function(r){cb(r?{meta:{at:r.at},json:JSON.stringify(r.d)}:{empty:true})}).catch(function(){cb(null)});
}
function cloudNote(){}
function failState(e){
  var c=e&&e.code;
  if(c==='gsi'||c==='auth'){CLOUD.state='giris';CLOUD.token=null}
  else if(e instanceof TypeError||c==='offline'){CLOUD.state='cevrimdisi'}
  else{CLOUD.state='hata';CLOUD.err=c||'hata'}
}
function loadRemote(d,at,msg){
  snapshot('Drive\'dan yüklemeden önce');
  S=d;if(!Array.isArray(S.gazLog))S.gazLog=[];persist();setHash(hashOf(JSON.stringify(S)));cloudSetAt(at);CLOUD.at=at;CLOUD.ok=true;CLOUD.state='hazir';
  if(!U.sheet)render();if(msg)toast(msg);
}
function cloudCheck(){
  if(!CLOUD.db||CLOUD.busy)return;
  CLOUD.busy=true;
  getToken(false).then(function(){return readRemote()}).then(function(r){
    CLOUD.state='hazir';CLOUD.err=null;CLOUD.checked=true;
    var localAt=cloudAt(),dirty=isDirty(),hasReal=realList().length>0;
    if(!r){CLOUD.ok=true;CLOUD.busy=false;cloudSchedule(0);return}
    if(!isValid(r.d)){CLOUD.ok=true;CLOUD.busy=false;cloudSchedule(0);return}
    if(!hasReal&&stampOf(r.d)>0){CLOUD.busy=false;loadRemote(r.d,r.at,'Drive\'daki kayıtlarınız yüklendi');return}
    if(r.at>localAt){
      if(dirty){CLOUD.conflict=true;CLOUD.pending={d:r.d,at:r.at}}
      else{CLOUD.busy=false;loadRemote(r.d,r.at,'Drive\'daki daha yeni kayıtlar yüklendi');return}
    }else{
      CLOUD.ok=true;CLOUD.at=r.at;
      if(dirty){CLOUD.busy=false;cloudSchedule(0);return}
    }
  }).catch(function(e){failState(e)}).then(function(){CLOUD.busy=false;if(!U.sheet)render();else updateChip()});
}
function cloudSchedule(ms){
  if(!CLOUD.db||CLOUD.conflict||!mirrorOn)return;
  clearTimeout(cloudT);cloudT=setTimeout(cloudPush,ms==null?2500:ms);
}
function cloudPush(){
  if(!CLOUD.db||CLOUD.conflict||!mirrorOn)return;
  if(CLOUD.busy){CLOUD.again=true;return}
  if(!CLOUD.checked){cloudCheck();return}
  var j=JSON.stringify(S),h=hashOf(j);
  if(CLOUD.ok&&h===getHash())return;
  if(typeof navigator!=='undefined'&&navigator.onLine===false){CLOUD.state='cevrimdisi';updateChip();return}
  CLOUD.busy=true;CLOUD.state='yaziyor';updateChip();
  var at=Date.now();
  getToken(false).then(function(){return CLOUD.fileId?null:findFile()}).then(function(){return CLOUD.fileId?null:createFile()})
  .then(function(){return writeFile(JSON.stringify({app:'tesis-stok',v:1,savedAt:at,data:S}))})
  .then(function(){CLOUD.at=at;cloudSetAt(at);setHash(h);CLOUD.ok=true;CLOUD.state='hazir';CLOUD.err=null})
  .catch(function(e){failState(e)})
  .then(function(){CLOUD.busy=false;if(U.tab==='ayar'&&!U.sheet)render();else updateChip();if(CLOUD.again){CLOUD.again=false;cloudSchedule(1500)}});
}
function cloudConnect(){
  CLOUD.state='baglaniyor';updateChip();
  getToken(true).then(function(){CLOUD.checked=false;CLOUD.busy=false;cloudCheck()}).catch(function(e){failState(e);if(CLOUD.state!=='giris')CLOUD.state='giris';updateChip();toast(e&&e.code==='gsi'?'Google yüklenemedi. İnterneti kontrol edin.':'Google girişi tamamlanamadı.')});
}

function stampOf(d){var t=0;d.moves.forEach(function(m){if(realTs(m)&&m.ts>t)t=m.ts});d.ships.forEach(function(x){if(realTs(x)&&x.ts>t)t=x.ts});return t}
function realList(){var a=[];S.moves.forEach(function(m){if(realTs(m))a.push(m.ts)});S.ships.forEach(function(x){if(realTs(x))a.push(x.ts)});return a}
function backupState(){var lb=S.lastBackupTs||0;return {n:realList().filter(function(t){return t>lb}).length,age:S.lastBackup?daysBetween(S.lastBackup,todayISO()):null}}

/* ---------- hesaplar ---------- */
var P=function(id){return S.products.find(function(p){return p.id===id})};
var lname=function(id){var l=S.locations.find(function(x){return x.id===id});return l?l.name:'?'};
function curP(){if(!P(U.mod))U.mod=S.products[0].id;return P(U.mod)}
function movesOf(pid){return S.moves.filter(function(m){return m.productId===pid})}
function balances(pid,upTo,exId){
  var b={};S.locations.forEach(function(l){b[l.id]=0});
  movesOf(pid).forEach(function(m){
    if(m.id===exId)return;if(upTo&&m.date>upTo)return;
    if(m.from)b[m.from]=(b[m.from]||0)-m.qty;if(m.to)b[m.to]=(b[m.to]||0)+m.qty;
  });
  return b;
}
function validate(moves){
  var b={};
  var sorted=sortMoves(moves);
  for(var i=0;i<sorted.length;i++){
    var m=sorted[i],k=m.productId;b[k]=b[k]||{};
    if(m.from){b[k][m.from]=(b[k][m.from]||0)-m.qty;if(b[k][m.from]<-1e-9)return {move:m,loc:m.from,bal:b[k][m.from]}}
    if(m.to)b[k][m.to]=(b[k][m.to]||0)+m.qty;
  }
  return null;
}
function stockErr(v){
  var p=P(v.move.productId);
  return 'Stok yetmiyor: '+(p.multi?lname(v.loc)+' konumunda ':'')+dshort(v.move.date)+' tarihli işlemden sonra bakiye '+fmt(v.bal)+' '+p.unit+' olur.';
}
function netMap(){
  var m={},last={};
  sortShips().forEach(function(s){s.items.forEach(function(it){
    if(s.dir==='gidis')last[it.cid]=it.kg;
    else if(last[it.cid]!=null){m[s.id+':'+it.cid]=it.kg-last[it.cid];delete last[it.cid]}
  })});
  return m;
}
function prevOutKg(cid,date,exId){
  var last={};
  sortShips().forEach(function(s){
    if(s.id===exId||s.date>date)return;
    s.items.forEach(function(it){if(it.cid===cid){if(s.dir==='gidis')last[cid]=it.kg;else delete last[cid]}});
  });
  return last[cid];
}
function cylHist(cid){
  var out=[];sortShips().forEach(function(s){s.items.forEach(function(it){if(it.cid===cid)out.push({s:s,it:it})})});return out;
}
function lastInfo(cid,nets){
  var h=cylHist(cid);if(!h.length)return 'Henüz sevkiyat kaydı yok';
  var l=h[h.length-1];

  for(var i=0;i<c.length;i++){if(c[i]>=f)return c[i]*e}

function dailySeries(pid,loc,from,to){
  var t=todayISO();if(to>t)to=t;if(from>to)return [];
  var B0=balances(pid,iso(addDays(parse(from),-1))),bal=loc==='all'?sum(B0):(B0[loc]||0),by={};
  movesOf(pid).forEach(function(m){if(m.date>=from&&m.date<=to)(by[m.date]=by[m.date]||[]).push(m)});
  var out=[],d=parse(from),e=parse(to);
  for(;d<=e;d=addDays(d,1)){
    var k=iso(d),r={d:k,alim:0,kul:0,adj:0,trIn:0,trOut:0,n:0};
    (by[k]||[]).forEach(function(m){
      var inS=loc==='all'?!!m.to:m.to===loc,outS=loc==='all'?!!m.from:m.from===loc;
      if(m.type==='alim'){if(inS)r.alim+=m.qty}
      else if(m.type==='kullanim'){if(outS)r.kul+=m.qty}
      else if(m.type==='transfer'){if(loc!=='all'){if(inS)r.trIn+=m.qty;if(outS)r.trOut+=m.qty}}

function agg(pid,range,loc){
  var t=todayISO(),end=range.e>t?t:range.e,B0=balances(pid,iso(addDays(parse(range.s),-1)));
  var r={open:loc==='all'?sum(B0):(B0[loc]||0),alim:0,kul:0,trIn:0,trOut:0,up:0,dn:0,nAlim:0,nKul:0,nTr:0,nAdj:0};
  movesOf(pid).forEach(function(m){
    if(m.date<range.s||m.date>range.e)return;
    var inS=loc==='all'?!!m.to:m.to===loc,outS=loc==='all'?!!m.from:m.from===loc;
    if(m.type==='alim'){if(inS){r.alim+=m.qty;r.nAlim++}}
    else if(m.type==='kullanim'){if(outS){r.kul+=m.qty;r.nKul++}}
    else if(m.type==='transfer'){if(loc!=='all'&&(inS||outS)){r.nTr++;if(inS)r.trIn+=m.qty;if(outS)r.trOut+=m.qty}}
    else{r.nAdj++;if(inS)r.up+=m.qty;if(outS)r.dn+=m.qty}
  });
  r.end=r.open+r.alim+r.trIn+r.up-r.kul-r.trOut-r.dn;

}

function dlt(c,pv,showPct){

/* tüp değişimi: doluma gidiş-gelişten ayrı kayıt */
function logSorted(){S.gazLog.forEach(function(e){if(!e.id)e.id='g'+uid()});return S.gazLog.slice().sort(function(a,b){return a.from<b.from?-1:a.from>b.from?1:0})}
function logStats(){
  var L=logSorted(),gaps=[],i;
  for(i=1;i<L.length;i++)gaps.push({days:daysBetween(L[i-1].from,L[i].from),d:L[i].from,prev:L[i-1].from});
  var avg=gaps.length?Math.round(gaps.reduce(function(s,g){return s+g.days},0)/gaps.length):null;
  return {L:L,gaps:gaps,avg:avg,last:L.length?L[L.length-1]:null};
}
function logRange(e){return dshort(e.from)+(e.to?' – '+dshort(e.to):'')}
function logKv(st){
  var t=todayISO(),next=st.last&&st.avg!=null?iso(addDays(parse(st.last.from),st.avg)):null;
  return '<div class="kvs in">'+
    kv('Son değişim',st.last?esc(dshort(st.last.from)):'–',st.last?daysBetween(st.last.from,t)+' gün önce':'Kayıt yok')+
    kv('Ortalama aralık',st.avg!=null?st.avg+'<span class="u">gün</span>':'–',st.avg!=null?st.gaps.length+' aralık üzerinden':'En az iki kayıt gerekir')+
    kv('Tahmini sonraki',next?esc(dshort(next)):'–',next?(next<t?(daysBetween(next,t)+' gün geçti'):(daysBetween(t,next)+' gün sonra')):'')+
    kv('Kayıt sayısı',String(st.L.length),'tüp değişimi')+'</div>';
}
function logChart(st,id){
  if(!st.gaps.length)return '<div class="empty small">Aralık grafiği için en az iki değişim kaydı gerekir.</div>';
  var g=st.gaps.slice(-12),bs=g.map(function(x){var d=parse(x.d);return {label:d.getDate()+' '+MON3[d.getMonth()],show:true,tip:dshort(x.prev)+' → '+dshort(x.d),name:'Aralık',v:x.days}});
  bs.forEach(function(b){b.aralik=b.v});
  return colChart(id,bs,'aralik','gün','Tüp değişimleri arasındaki gün sayısı.','s-aralik');
}
function logRows(list,limit){
  var l=list.slice().reverse(),shown=limit?l.slice(0,limit):l,st=logStats(),gp={};st.gaps.forEach(function(g){gp[g.d]=g.days});
  return shown.map(function(e){return '<button type="button" class="logrow" data-a="gledit" data-id="'+e.id+'"><span><b>'+esc(logRange(e))+'</b>'+(e.note?'<br><small>'+esc(e.note)+'</small>':'')+'</span><small>'+(gp[e.from]!=null?gp[e.from]+' gün sonra':'ilk kayıt')+'</small></button>'}).join('');

function gazData(range){
  var nets=netMap(),ships=sortShips().filter(function(s){return s.date>=range.s&&s.date<=range.e}),rows=[],out=0,inn=0,kg=0;
  ships.forEach(function(s){
    if(s.dir==='gidis')out+=s.items.length;else inn+=s.items.length;
    s.items.forEach(function(it){
      var c=S.cyl.find(function(x){return x.id===it.cid});var net=nets[s.id+':'+it.cid];
      if(s.dir==='donus'&&net!=null)kg+=net;
      rows.push({s:s,serial:c?c.serial:'?',kg:it.kg,net:net});
    });
  });
  return {ships:ships,rows:rows,out:out,inn:inn,kg:kg,nets:nets};
}

/* ---------- panel (yalnızca izleme) ---------- */
function stockShort(p,total){return total<=0?['bad','Stok yok']:total<(p.min||0)?['warn','Kritik']:['ok','Yeterli']}
function peakOf(pid){var t=0,pk=0;sortMoves(movesOf(pid)).forEach(function(m){if(m.to)t+=m.qty;if(m.from)t-=m.qty;if(t>pk)pk=t});return pk}
function ringSvg(frac,tone){var c=213.6,off=c*(1-Math.max(0,Math.min(1,frac)));return '<svg class="ring" viewBox="0 0 84 84" aria-hidden="true"><circle class="r0" cx="42" cy="42" r="34"/><circle class="rv '+tone+'" cx="42" cy="42" r="34" stroke-dasharray="'+c+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 42 42)"/></svg>'}
function dtr(d){var a=d.split('-');return a[2]+'.'+a[1]+'.'+a[0]}
function tm(ts){return new Date(ts).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})}
function realTs(e){return e.ts&&Math.abs(e.ts-parse(e.date).getTime())>5000}
function feedItems(){
  var it=[];
  S.moves.forEach(function(m){
    var p=P(m.productId);if(!p)return;var q=fmt(m.qty)+' '+p.unit+' '+p.name,w=p.multi?(m.type==='kullanim'&&m.from?lname(m.from)+' deposunda ':m.type==='alim'&&m.to?lname(m.to)+' konumuna ':''):'',t;
    if(m.type==='alim')t=w+q+' alındı';
    else if(m.type==='kullanim')t=w+q+' kullanıldı';
    else if(m.type==='transfer')t=q+' transfer edildi ('+lname(m.from)+' → '+lname(m.to)+')';
    else t=q+' sayım düzeltmesi ('+(m.to?'fazla':'eksik')+')';
    it.push({date:m.date,ts:m.ts,real:realTs(m),text:t,tone:m.type==='duzeltme'?'duzeltme':m.type});
  });
  S.ships.forEach(function(x){var n=x.items.length;it.push({date:x.date,ts:x.ts,real:realTs(x),text:n+' gaz klor tüpü '+(x.dir==='gidis'?'doluma gönderildi':'dolumdan geldi'),tone:x.dir==='gidis'?'gidis':'donus'})});
  return it.sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:(b.ts||0)-(a.ts||0)});
}
function feedCard(){
  var it=feedItems();if(!it.length)return '';
  var l=it[0],when=dtr(l.date)+(l.real?' '+tm(l.ts):''),days=daysBetween(l.date,todayISO());
  var rec=it.slice(0,5).map(function(x){return '<div class="frow t-'+x.tone+'"><i class="kd"></i><span><b>'+dtr(x.date)+(x.real?' '+tm(x.ts):'')+'</b> · '+esc(x.text)+'</span></div>'}).join('');
  return '<section class="card hero-st t-degisim"><div class="hrow"><div><p class="h">Son kayıt</p><div class="lastrec">'+when+'</div><p class="eq">'+(days===0?'Bugün girildi':days===1?'Dün girildi':days+' gün önce')+(l.real?'':' · saat bilgisi yok (Excel kaydı)')+'</p></div><span class="ico">'+ic('hareket',18)+'</span></div><div class="feed"><p class="h" style="margin-bottom:6px">Son 5 hareket</p>'+rec+'</div><p class="note-s" style="margin-top:10px">'+(S.lastBackup?'Son yedek: '+dtr(S.lastBackup):'Henüz yedek alınmadı')+'</p></section>';
}
function viewPanel(){
  var t0=iso(addDays(new Date(),-29)),h='<div class="stack">';
  S.products.filter(function(p){return p.multi}).forEach(function(p){
    var B=balances(p.id),total=sum(B),st=stockShort(p,total);
    var mx=Math.max.apply(null,[1].concat(S.locations.map(function(l){return B[l.id]||0})));
    h+='<section class="card"><div class="hrow"><div><h2 class="h">'+esc(p.name)+'</h2><div class="big">'+fmt(total)+'<span class="u">'+esc(p.unit)+'</span></div></div><span class="pill '+st[0]+'">'+st[1]+'</span></div><div class="pgrid">'+
      S.locations.map(function(l,i){var v=B[l.id]||0,pc=v>0?Math.max(10,Math.round(v/mx*100)):0;return '<div class="ptile'+(i===0?' main':'')+(v<=0?' zero':'')+'">'+(pc>0?'<i class="fill" style="height:'+pc+'%"></i>':'')+'<small>'+esc(l.name)+'</small><b>'+fmt(v)+'</b></div>'}).join('')+'</div><p class="note-s">Dolgu yüksekliği, konumlar arasındaki en yüksek stoğa göre ölçeklenir.</p></section>';
  });
  var cnt={};STO.forEach(function(k){cnt[k]=S.cyl.filter(function(c){return c.status===k}).length});
  h+='<section class="card"><div class="hd" style="margin-bottom:0"><h2 class="h">Gaz klor tüpleri</h2><span class="muted" style="font-size:13px">'+S.cyl.length+' tüp</span></div>';
  if(!S.cyl.length){h+='<div class="empty">Henüz tüp eklenmedi.</div>'}
  else{
    h+='<div class="sgrid">'+STO.map(function(k){return '<div class="stile st-'+k+'"><span class="sl">'+ST[k]+'</span><b>'+cnt[k]+'</b></div>'}).join('')+'</div>';
    var gs=sortShips().filter(function(s){return s.dir==='gidis'}),lg=gs.length?gs[gs.length-1]:null;
    h+='<p class="cover">'+(lg?'Son doluma gidiş: '+dshort(lg.date)+', '+lg.items.length+' tüp.':'Henüz doluma gönderilmedi.')+'</p>';
    var ls=logStats();h+='<p class="cover" style="margin-top:4px">'+(ls.last?'Son tüp değişimi: '+dshort(ls.last.from)+' ('+daysBetween(ls.last.from,todayISO())+' gün önce).':'Tüp değişimi kaydı yok.')+'</p>';
    if(cnt.bos>0&&cnt.bos>=S.gazAlert)h+='<p class="note warn" style="margin-top:10px">Boş tüp sayısı '+cnt.bos+'. Doluma gönderme zamanı gelmiş olabilir.</p>';
  }
  h+='</section>';
  var simple=S.products.filter(function(p){return !p.multi});
  if(simple.length){
    h+='<div class="pcols">'+simple.map(function(p){
      var total=sum(balances(p.id)),st=stockShort(p,total),out30=0,pk=peakOf(p.id);
      movesOf(p.id).forEach(function(m){if(m.date>=t0&&m.type==='kullanim')out30+=m.qty});
      var cover=out30>0&&total>0?Math.round(total/(out30/30)):null,fr=pk>0?total/pk:0;
      return '<section class="card pcard"><h2 class="h">'+esc(p.name)+'</h2><div class="ringwrap">'+ringSvg(fr,st[0])+'<div class="rc"><b>%'+Math.round(Math.max(0,fr)*100)+'</b></div></div><div class="num">'+fmt(total)+'<span>'+esc(p.unit)+'</span></div>'+(p.kg?'<p class="eq">≈ '+fmt(total*p.kg)+' kg</p>':'')+'<span class="pill '+st[0]+'">'+st[1]+'</span>'+(cover!=null?'<p class="cover" style="margin-top:8px">≈ '+cover+' gün yeter</p>':'')+'</section>';
    }).join('')+'</div><p class="note-s" style="margin-top:-4px">Halka, stoğun kayıtlardaki en yüksek stoğa oranını gösterir.</p>';
  }
  return h+feedCard()+'</div>';
}
function render(){
  CH={};

  for(var i=0;i<ids.length;i++){
    var c=S.cyl.find(function(x){return x.id===ids[i]}),kg=parseNum(F.kg[ids[i]]);

  if(warn.length&&!F.ok){F.ok=true;err(warn.join(', ')+' için geliş kilosu gidiş kilosundan düşük ya da eşit görünüyor. Kontrol edin, doğruysa "Yine de kaydet"e basın.');renderSheet();return}

    S.cyl.forEach(function(c){if(out?c.status==='bos':c.status==='doluma')F.sel[c.id]=true});renderSheet();
  },
  alertstep:function(el){S.gazAlert=Math.max(1,Math.min(20,S.gazAlert+Number(el.dataset.d)));persist();render()},
  filesave:function(){fileBackup()},
  filerest:function(){pickFile()},
  backup:function(){U.sheet={kind:'backup',text:JSON.stringify(S)};renderSheet(true)},
  bkcopy:function(){var t=U.sheet.text;copyText(t).then(function(ok){toast(ok?'Kopyalandı. Şimdi Notlar\'a yapıştırın.':'Kopyalanamadı. Metni elle seçip kopyalayın.');if(!ok){var ta=$('#f-txt');if(ta){ta.focus();ta.select()}}})},
  bkdone:function(){S.lastBackup=todayISO();S.lastBackupTs=Date.now();persist();U.sheet=null;renderSheet();render();toast('Yedek kaydedildi')},
  snaprest:function(el){U.sheet={kind:'confirm',title:'Otomatik kopyadan dön',msg:'Şu anki kayıtlar bu kopyayla değiştirilir. Geri dönmek isterseniz bu işlemden önceki hâl de ayrıca saklanır.',yes:'Evet, geri yükle',act:'snapgo',ts:el.dataset.t};renderSheet(true)},
  snapgo:function(){var x=snaps().find(function(a){return String(a.ts)===String(U.sheet.ts)});if(!x){U.sheet=null;renderSheet();return toast('Kopya bulunamadı')}
    var d;try{d=JSON.parse(x.json)}catch(e){U.sheet=null;renderSheet();return toast('Kopya okunamadı')}
    if(!isValid(d)){U.sheet=null;renderSheet();return toast('Kopya geçersiz')}
    snapshot('Geri yüklemeden önce');S=d;if(!Array.isArray(S.gazLog))S.gazLog=[];persist();U.sheet=null;renderSheet();render();toast('Kopya yüklendi')},
  restore:function(){U.sheet={kind:'restore',err:'',f:{text:'',ok:false}};renderSheet(true)},

  clearGo:function(){snapshot('Örnekleri silmeden önce');S.moves=[];S.cyl=[];S.ships=[];S.sample=false;persist();U.sheet=null;renderSheet();render();toast('Örnekler silindi')},

};
function restoreGo(){
  var F=U.sheet.f,d;
  try{d=JSON.parse(F.text.trim())}catch(e){return err('Bu metin geçerli bir yedek değil.')}
  if(!isValid(d))return err('Bu metin geçerli bir yedek değil.');
  if(!F.ok){F.ok=true;err('Mevcut kayıtlar silinip yedeğin içeriği yüklenecek. Emin misiniz?');renderSheet();return}
  snapshot('Yedek yüklemeden önce');S=d;if(typeof S.gazAlert!=='number')S.gazAlert=3;if(!Array.isArray(S.gazLog))S.gazLog=[];persist();U.mod=S.products[0].id;U.sheet=null;renderSheet();render();toast('Yedek yüklendi');
}
document.addEventListener('click',function(e){
  var el=e.target.closest?e.target.closest('[data-a]'):null;if(!el)return;
  var f=ACT[el.dataset.a];if(f)f(el,e);
});
document.addEventListener('input',function(e){
  var el=e.target;if(!U.sheet)return;
  if(el.dataset&&el.dataset.f&&U.sheet.f){U.sheet.f[el.dataset.f]=el.value;if(el.dataset.f==='qty')updateHint()}
  else if(el.dataset&&el.dataset.kg){U.sheet.f.kg[el.dataset.kg]=el.value}
});
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.id==='rLoc'){U.r.loc=el.value;U.r.limit=50;render();return}
  if(!U.sheet||!U.sheet.f)return;
  if(el.dataset.f){U.sheet.f[el.dataset.f]=el.value;if(U.sheet.kind==='move')updateHint();if(U.sheet.kind==='gidis'||U.sheet.kind==='donus')renderSheet()}
  else if(el.dataset.chk){U.sheet.f.sel[el.dataset.chk]=el.checked;renderSheet()}
});
document.addEventListener('submit',function(e){
  e.preventDefault();var s=U.sheet;if(!s)return;
  var h={move:saveMove,product:saveProduct,loc:saveLoc,cylAdd:saveCylAdd,gidis:saveShip,donus:saveShip,restore:restoreGo,gazlog:saveGazLog}[s.kind];if(h)h();
});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&CLOUD.db&&CLOUD.state==='hazir'&&!U.sheet){CLOUD.checked=false;cloudCheck()}});
window.addEventListener('online',function(){if(CLOUD.db){CLOUD.state=CLOUD.token?'hazir':'giris';cloudSchedule(0)}});
document.addEventListener('pointermove',chPointer);document.addEventListener('pointerdown',chPointer);
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&U.sheet){closeSheet();return}
  var cv=e.target&&e.target.closest?e.target.closest('.cv'):null;if(!cv||!CH[cv.dataset.ch])return;
  var n=CH[cv.dataset.ch].items.length;
  if(e.key==='ArrowLeft'){e.preventDefault();chShow(cv,(cv._i==null?n:cv._i)-1)}
  else if(e.key==='ArrowRight'){e.preventDefault();chShow(cv,(cv._i==null?-1:cv._i)+1)}
  else if(e.key==='Escape'){chHide(cv)}
});

UIP=loadUI();applyUI();
S=load();
var hadLocal=!!S;
if(!S||S.sample){S=fromExcel()}
if(!Array.isArray(S.gazLog))S.gazLog=[];
if(typeof S.gazAlert!=='number')S.gazAlert=3;
try{if(typeof navigator!=='undefined'&&navigator.storage){if(navigator.storage.persisted)navigator.storage.persisted().then(function(v){PERSISTED=v});if(navigator.storage.persist)navigator.storage.persist().then(function(g){PERSISTED=g})}}catch(e){}
if(hadLocal){mirrorOn=true;persist();render();cloudInit(function(){cloudCheck()})}
else{
  persist();render();
  var cands=[],pend=2,fin=function(){
    if(--pend)return;
    cands.sort(function(a,b){return stampOf(b)-stampOf(a)});
    var d=cands[0];
    if(d&&(stampOf(d)>0||d.moves.length>S.moves.length)){S=d;if(!Array.isArray(S.gazLog))S.gazLog=[];mirrorOn=true;persist();render();toast('Kayıtlarınız yedek kopyadan geri yüklendi');if(CLOUD.db)cloudCheck();return}
    mirrorOn=true;persist();if(CLOUD.db)cloudCheck();
  };
  idbGet(function(j){try{var d=j?JSON.parse(j):null;if(d&&isValid(d)&&!d.sample){if(!Array.isArray(d.gazLog))d.gazLog=[];cands.push(d)}}catch(e){}fin()});
  cloudInit(function(){
    if(!CLOUD.db)return fin();
    cloudRead(function(r){
      try{if(r&&r.json){cloudNote(r);var d=JSON.parse(r.json);if(isValid(d)&&!d.sample){if(!Array.isArray(d.gazLog))d.gazLog=[];cands.push(d);cloudSetAt(r.meta.at)}}}catch(e){}
      fin();
    });
  });
}
if(typeof window!=='undefined'&&window.__TEST__)window.__TEST__.api={U:U,S:function(){return S},render:render,renderSheet:renderSheet,openMove:openMove,openShip:openShip,openProduct:openProduct,openLoc:openLoc,validate:validate,ACT:ACT,buildCsv:buildCsv,netMap:netMap,saveMove:saveMove,saveShip:saveShip};
})();
